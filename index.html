kan kriteria Asia Pasifik, langkah selanjutnya adalah","a":"Bedah bariatrik","w":"Pada obesitas dengan IMT 35 atau lebih disertai komorbid yang gagal terapi konservatif intensif, bedah bariatrik seperti sleeve gastrectomy direkomendasikan.","d":[["Intensifikasi farmakoterapi","Sudah dicoba tanpa hasil memadai."],["Diet sangat rendah kalori","Tidak cukup untuk kasus refrakter."],["Konseling psikologis intensif","Pendukung, bukan pengganti bedah."],["Program olahraga supervised","Termasuk terapi konservatif yang sudah gagal."]],"s":"2","r":"Dokter umum merujuk pasien yang memenuhi indikasi bedah bariatrik."},{"c":"Obesitas & Sindrom Metabolik","q":"Pada pasien obesitas, apakah target penurunan berat badan per minggu yang baik?","a":"0,5-1 kg per minggu","w":"Target awal adalah 5-10 persen berat badan awal dalam 6 bulan, dengan kecepatan 0,5-1 kg per minggu. Selanjutnya pertahankan berat badan atau turunkan lagi.","d":[["Kurang dari 0,25 kg per minggu","Terlalu lambat untuk target 6 bulan."],["1-2 kg per minggu","Terlalu cepat dan sulit dipertahankan."],["2-3 kg per minggu","Terlalu cepat, berisiko kehilangan massa otot dan batu empedu."],["3-4 kg per minggu","Tidak aman."]],"s":"—","r":"Non-penyakit: target penurunan berat badan realistis."},{"c":"Obesitas & Sindrom Metabolik","q":"Pada obesitas, hormon leptin sangat berperan. Apakah efek utama leptin pada hipotalamus?","a":"Menurunkan nafsu makan","w":"Leptin dari adiposit bekerja di hipotalamus menekan NPY dan menstimulasi POMC sehingga nafsu makan turun. Pada obesitas terjadi resistensi leptin.","d":[["Meningkatkan nafsu makan","Ghrelin yang meningkatkan nafsu makan."],["Menghambat termogenesis","Leptin justru meningkatkan pengeluaran energi."],["Meningkatkan sekresi ghrelin","Leptin tidak meningkatkan ghrelin."],["Menurunkan sensitivitas insulin","Bukan efek utama leptin."]],"s":"—","r":"Non-penyakit: fisiologi regulasi nafsu makan."},{"c":"Obesitas & Sindrom Metabolik","q":"Seorang laki-laki berusia 55 tahun dengan obesitas IMT 32 kg/m2 mengeluh nyeri epigastrium dan mual setelah makan berlemak. USG abdomen menunjukkan fatty liver derajat II. Ia tidak mengonsumsi alkohol. SGOT dan SGPT meningkat 2 kali batas normal. Diagnosis yang paling tepat adalah","a":"Penyakit perlemakan hati non-alkoholik","w":"Steatosis hati pada obesitas tanpa konsumsi alkohol dengan peningkatan transaminase ringan adalah NAFLD atau MASLD, manifestasi hepatik sindrom metabolik.","d":[["Hepatitis alkoholik","Tidak ada riwayat alkohol."],["Kolelitiasis","USG menunjukkan fatty liver, bukan batu empedu."],["Pankreatitis kronik","Tidak ada temuan pankreas."],["Hepatitis B kronik","Tidak ada penanda infeksi virus."]],"s":"3A","r":"Dokter umum mengedukasi perubahan gaya hidup dan mencari komorbid."},{"c":"Obesitas & Sindrom Metabolik","q":"Seorang anak laki-laki berusia 10 tahun dengan BMI 27 kg/m2 sering terbangun saat tidur karena henti napas. Komorbiditas yang mungkin dialami pasien adalah","a":"Sleep apnea obstruktif","w":"Obesitas anak berhubungan dengan sleep apnea obstruktif yang ditandai dengkuran dan henti napas saat tidur.","d":[["Gagal jantung kongestif","Tidak sesuai dengan gambaran."],["Hipertiroidisme","Tidak sesuai."],["Asma bronkial","Tidak berkaitan dengan henti napas saat tidur."],["Penyakit paru obstruktif kronik","Tidak terjadi pada anak."]],"s":"3A","r":"Dokter umum mengenali OSA pada anak obes."},{"c":"Metabolik Lain","q":"Seorang laki-laki berusia 65 tahun datang dengan nyeri pada ibu jari kaki kanan tanpa riwayat trauma. Pemeriksaan menunjukkan nodul hiperemis dan nyeri tekan pada sendi metatarsofalangeal I, kolesterol 192 mg/dL, GDS 131 mg/dL, dan asam urat 12 mg/dL. Untuk menegakkan diagnosis pasti dilakukan","a":"Aspirasi cairan sendi dan analisis kristal monosodium urat","w":"Diagnosis pasti gout adalah ditemukannya kristal monosodium urat berbentuk jarum dengan birefringence negatif pada aspirat cairan sendi.","d":[["Foto polos pedis","Dapat membantu tetapi tidak definitif untuk gout akut."],["Kultur darah","Dipakai untuk sepsis."],["Biopsi sinovium","Bukan pemeriksaan standar."],["Pemeriksaan antibodi antinuklear","Dipakai pada penyakit autoimun."]],"s":"4A","r":"Dokter umum mendiagnosis gout dan mengobati serangan akut."},{"c":"Metabolik Lain","q":"Seorang pasien dislipidemia ingin memulai terapi non-farmakologis. Manakah yang tepat?","a":"Pembatasan lemak jenuh dan peningkatan aktivitas fisik","w":"Terapi non-farmakologis dislipidemia adalah modifikasi gaya hidup, yaitu pembatasan lemak jenuh dan kolesterol, peningkatan serat, aktivitas fisik, serta penurunan berat badan.","d":[["Peningkatan konsumsi lemak jenuh","Memperburuk LDL."],["Suplemen protein tinggi","Tidak terbukti menurunkan lipid."],["Pemberian insulin","Bukan terapi dislipidemia."],["Tirah baring","Mengurangi aktivitas fisik, kontraproduktif."]],"s":"4A","r":"Dokter umum memulai modifikasi gaya hidup dan statin bila perlu."},{"c":"Vitamin & Mikronutrien","q":"Seorang wanita berusia 35 tahun datang ke puskesmas dengan keluhan mudah lelah, pucat, dan kesemutan pada tangan dan kaki sejak beberapa bulan. Didapatkan anemia megaloblastik. Defisiensi yang paling mungkin adalah","a":"Vitamin B12","w":"Anemia megaloblastik disertai gejala neurologis seperti parestesia khas defisiensi vitamin B12. Defisiensi folat saja tidak menyebabkan neuropati.","d":[["Vitamin B3","Defisiensi menyebabkan pelagra."],["Vitamin B6","Menyebabkan anemia sideroblastik dan neuropati perifer."],["Zat besi","Menyebabkan anemia mikrositik."],["Asam folat","Menyebabkan anemia megaloblastik tanpa neuropati."]],"s":"3A","r":"Dokter umum mengenali defisiensi B12 dan menghindari pemberian folat saja yang dapat menutupi gejala neurologis."},{"c":"Vitamin & Mikronutrien","q":"Seorang perempuan berusia 60 tahun datang dengan kelelahan, pusing, sesak saat aktivitas ringan, nafsu makan berkurang, penurunan berat badan 5 kg dalam 2 bulan, serta nyeri lidah yang tampak merah cerah. Defisiensi apakah yang mendasari?","a":"Vitamin B12","w":"Glositis merah cerah disertai anemia megaloblastik dan penurunan berat badan sesuai anemia pernisiosa akibat defisiensi vitamin B12.","d":[["Vitamin B1","Menyebabkan beri-beri atau Wernicke."],["Vitamin B6","Menyebabkan neuropati dan dermatitis."],["Vitamin C","Menyebabkan skorbut dengan gusi berdarah."],["Zat besi","Menyebabkan anemia mikrositik dengan koilonikia."]],"s":"3A","r":"Dokter umum mencurigai anemia pernisiosa pada lansia dengan glositis dan anemia."},{"c":"Vitamin & Mikronutrien","q":"Seorang wanita berusia 30 tahun didapatkan kekurangan vitamin B12. Manifestasi hematologi yang terjadi adalah","a":"Anemia makrositik","w":"Defisiensi B12 mengganggu sintesis DNA sehingga sel darah merah membesar, yaitu anemia makrositik atau megaloblastik.","d":[["Dermatitis","Gejala defisiensi niasin dan zink."],["Anemia mikrositik","Pada defisiensi besi atau talasemia."],["Anemia defisiensi besi","Karena kekurangan besi."],["Rabun senja","Karena defisiensi vitamin A."]],"s":"3A","r":"Dokter umum mengenali manifestasi defisiensi vitamin."},{"c":"Vitamin & Mikronutrien","q":"Seorang wanita berusia 25 tahun tidak pernah mengonsumsi suplemen vitamin selama persiapan kehamilan. Setelah 2 bulan ia hamil. USG trimester pertama menemukan cacat penutupan tabung saraf. Defisiensi yang paling mungkin adalah","a":"Asam folat","w":"Asam folat penting untuk penutupan tabung saraf pada minggu ke-3 sampai ke-4 kehamilan. Defisiensinya menyebabkan neural tube defect seperti spina bifida.","d":[["Vitamin B1","Menyebabkan beri-beri."],["Vitamin B6","Tidak terkait langsung dengan NTD."],["Vitamin B12","Berkaitan dengan anemia pernisiosa."],["Vitamin A","Berlebihan bersifat teratogenik, bukan defisiensinya penyebab NTD."]],"s":"—","r":"Non-penyakit: konseling prakonsepsi, asam folat 400 mcg per hari."},{"c":"Vitamin & Mikronutrien","q":"Seorang pria berusia 55 tahun dengan alkoholisme kronik datang dengan ataksia dan nistagmus. Kadar tiamin rendah. Enzim yang aktivitasnya terganggu dan sering diukur adalah","a":"Transketolase","w":"Tiamin pirofosfat adalah kofaktor transketolase, piruvat dehidrogenase, dan alfa-ketoglutarat dehidrogenase. Aktivitas transketolase eritrosit dipakai untuk menilai status tiamin.","d":[["Glutation reduktase","Bergantung pada riboflavin."],["Piruvat karboksilase","Bergantung pada biotin."],["Metilmalonil-KoA mutase","Bergantung pada vitamin B12."],["Glukosa-6-fosfatase","Bukan enzim bergantung tiamin."]],"s":"3A","r":"Dokter umum memberi tiamin sebelum glukosa pada kecurigaan ensefalopati Wernicke."},{"c":"Etika & Psikososial","q":"Seorang pasien DM dengan ulkus kaki memerlukan amputasi. Dokter memutuskan amputasi tanpa menjelaskan langsung kepada pasien dan keluarga, hanya mendelegasikan perawat asisten untuk meminta persetujuan tindakan. Kaidah bioetika yang dilanggar adalah","a":"Autonomy","w":"Persetujuan tindakan adalah wujud autonomi pasien dan harus diperoleh setelah penjelasan lengkap oleh dokter yang melakukan tindakan, bukan didelegasikan.","d":[["Beneficence","Amputasi mungkin bermanfaat bagi pasien."],["Justice","Tidak ada ketidakadilan alokasi sumber daya."],["Nonmaleficence","Tindakan medis sendiri tidak dinilai sebagai merugikan."],["Veracity","Terkait kejujuran informasi, dan inti pelanggaran adalah hak memutuskan."]],"s":"—","r":"Non-penyakit: etika, informed consent."},{"c":"Etika & Psikososial","q":"Seorang laki-laki berusia 60 tahun didiagnosis gangren diabetikum dan disarankan amputasi, tetapi ia menolak dan memilih mengobati lukanya secara tradisional. Prinsip bioetik yang paling utama dihormati adalah","a":"Autonomy","w":"Pasien kompeten berhak menolak tindakan setelah mendapat informasi, dan dokter wajib menghormati keputusan itu.","d":[["Beneficence","Dokter berniat baik, tetapi tidak boleh memaksa."],["Nonmaleficence","Tidak menggantikan hak memilih."],["Justice","Berkaitan dengan keadilan layanan."],["Veracity","Kejujuran informasi, bukan hak memutuskan."]],"s":"—","r":"Non-penyakit: etika penolakan tindakan."},{"c":"Etika & Psikososial","q":"Seorang laki-laki berusia 60 tahun didiagnosis gangren diabetikum dan menolak amputasi, memilih pengobatan tradisional di rumah. Sikap dokter yang paling tepat adalah","a":"Menjelaskan risiko dan manfaat, lalu menghormati keputusan pasien","w":"Dokter memberi informasi lengkap, memastikan pasien memahami, kemudian menghormati keputusan serta mendokumentasikannya, dan tetap membuka kesempatan berubah pikiran.","d":[["Memaksa amputasi demi menyelamatkan nyawa","Melanggar autonomi."],["Membiarkan pasien pulang tanpa penjelasan lanjutan","Melanggar kewajiban memberi informasi."],["Mengikuti keinginan keluarga agar dirawat di rumah tanpa amputasi","Keputusan ada pada pasien kompeten."],["Melaporkan penolakan tanpa berdiskusi dengan pasien","Mengabaikan komunikasi."]],"s":"—","r":"Non-penyakit: komunikasi dan etika."},{"c":"Etika & Psikososial","q":"Seorang ayah menjawab pertanyaan anaknya di luar ruang periksa dengan berkata, Gapapa kok, saya sehat saja, padahal dokter menjelaskan bahwa ia menderita diabetes melitus. Menurut Kubler-Ross, ini termasuk tahap","a":"Denial","w":"Menolak menerima kenyataan sakit adalah tahap denial atau penyangkalan.","d":[["Anger","Ditandai kemarahan."],["Bargaining","Tawar-menawar."],["Depression","Kesedihan mendalam."],["Acceptance","Menerima kenyataan."]],"s":"—","r":"Non-penyakit: respons psikologis terhadap penyakit kronik."}];

const BLOCK="Blok Endokrin, Metabolik, dan Nutrisi";
const KEY="cbt-endokrin-v1";
const LET=["A","B","C","D","E"];
const $=s=>document.querySelector(s);
let S=null, tick=null, view="start", filter="all", navOpen=false;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function clearSave(){try{localStorage.removeItem(KEY)}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmt(t){t=Math.max(0,t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}

function newSession(cfg){
  const n=Q.length;
  const order=cfg.shuffleQ?shuffle([...Array(n).keys()]):[...Array(n).keys()];
  const posList=shuffle(Array.from({length:n},(_,i)=>i%5));
  const opts={};
  order.forEach((qi,k)=>{const cp=posList[k];const d=shuffle([1,2,3,4]);const perm=[];let di=0;for(let p=0;p<5;p++){perm.push(p===cp?0:d[di++])}opts[qi]=perm});
  S={v:1,mode:cfg.mode,shuffleQ:cfg.shuffleQ,total:cfg.minutes*60,remaining:cfg.minutes*60,timerStarted:false,order,opts,ans:{},flags:{},pos:0,finished:false,lastTick:null};
  save();
}
function correctCount(){return Q.reduce((c,_,qi)=>c+(S.ans[qi]===0?1:0),0)}
function isLocked(qi){return S.finished||(S.mode==="latihan"&&S.ans[qi]!==undefined)}

function startTimer(){
  if(tick)clearInterval(tick);
  S.lastTick=Date.now();
  tick=setInterval(()=>{
    if(S.finished||!S.timerStarted){return}
    const now=Date.now();const dt=Math.max(1,Math.round((now-S.lastTick)/1000));S.lastTick=now;
    S.remaining-=dt;if(S.remaining<=0){S.remaining=0;finish(true);return}
    save();updTimer();
  },1000);
}
function updTimer(){const el=$("#timer");if(!el)return;el.textContent=fmt(S.remaining);el.classList.toggle("low",S.remaining<=300&&S.timerStarted);el.classList.toggle("idle",!S.timerStarted)}

/* ---------- START ---------- */
function renderStart(){
  view="start";
  const saved=load();
  const cats={};Q.forEach(q=>cats[q.c]=(cats[q.c]||0)+1);
  const canResume=saved&&saved.v===1&&!saved.finished;
  const done=saved&&saved.finished;
  $("#app").innerHTML=`<div class="wrap"><div class="card hero">
  <span class="chip">CBT Simulasi</span>
  <h1 style="margin-top:10px">${BLOCK}</h1>
  <p class="sub">Bank soal gabungan dari dokumen recall, dengan vignette klinis dan pembahasan berbasis EBM.</p>
  <div class="kpis"><div class="kpi"><b>${Q.length}</b><span>soal</span></div><div class="kpi"><b>${Object.keys(cats).length}</b><span>topik</span></div><div class="kpi"><b>5</b><span>opsi A sampai E</span></div></div>
  <div class="cats">${Object.entries(cats).map(([k,v])=>`<span class="chip g">${esc(k)} · ${v}</span>`).join("")}</div>
  ${canResume?`<div class="row" style="margin-bottom:14px;border-color:var(--acc);background:var(--acc2)"><div><b>Ada ujian yang belum selesai</b><small>${Object.keys(saved.ans).length} dari ${Q.length} terjawab, sisa waktu ${fmt(saved.remaining)}</small></div><button class="btn pri" id="resume">Lanjutkan</button></div>`:""}
  ${done?`<div class="row" style="margin-bottom:14px"><div><b>Ujian terakhir sudah selesai</b><small>Buka kembali skor dan pembahasannya</small></div><button class="btn" id="seeres">Lihat hasil</button></div>`:""}
  <div class="set">
   <div class="row"><div><b>Durasi ujian</b><small>Timer mulai berjalan saat kamu memilih jawaban pertama di soal no. 1</small></div><div><input type="number" id="mins" min="5" max="300" value="90"> <span style="color:var(--mute)">menit</span></div></div>
   <div class="row"><div><b>Acak urutan soal</b><small>Aktif secara default, seperti ujian blok sungguhan. Urutan opsi selalu diacak.</small></div><label class="sw"><input type="checkbox" id="shq" checked><span></span></label></div>
   <div class="row"><div><b>Mode latihan</b><small>Pembahasan langsung muncul setelah menjawab dan jawaban terkunci. Bila mati, pembahasan dibuka setelah ujian selesai.</small></div><label class="sw"><input type="checkbox" id="prac"><span></span></label></div>
  </div>
  <button class="btn pri" id="go" style="width:100%;padding:14px;font-size:17px">Mulai ujian baru</button>
  </div></div>`;
  $("#foot").classList.remove("hidden");
  const r=$("#resume");if(r)r.onclick=()=>{S=saved;enterExam()};
  const sr=$("#seeres");if(sr)sr.onclick=()=>{S=saved;enterExam()};
  $("#go").onclick=()=>{
    if((canResume)&&!confirm("Memulai ujian baru akan menghapus progres yang tersimpan. Lanjutkan?"))return;
    const m=Math.min(300,Math.max(5,parseInt($("#mins").value)||90));
    newSession({minutes:m,shuffleQ:$("#shq").checked,mode:$("#prac").checked?"latihan":"ujian"});
    enterExam();
  };
}

/* ---------- EXAM ---------- */
function enterExam(){startTimer();if(S.finished){view="result";renderResult()}else{view="exam";renderExam()}}

function navHTML(){
  const items=S.order.map((qi,k)=>{
    let c="nb";
    if(S.finished){c+=S.ans[qi]===undefined?"":(S.ans[qi]===0?" ok":" bad")}
    else if(S.ans[qi]!==undefined)c+=" ans";
    if(S.flags[qi])c+=" flag";
    if(!S.finished&&k===S.pos)c+=" cur";
    return `<button class="${c}" data-k="${k}" aria-label="Soal ${k+1}">${k+1}</button>`}).join("");
  const answered=Object.keys(S.ans).length,fl=Object.keys(S.flags).filter(k=>S.flags[k]).length;
  return `<h3>Navigasi soal</h3><div class="stat">${answered} terjawab · ${Q.length-answered} kosong · ${fl} ditandai</div><div class="grid">${items}</div>
  <div class="legend">${S.finished?`<span><i style="background:var(--ok)"></i>Benar</span><span><i style="background:var(--bad)"></i>Salah</span><span><i></i>Kosong</span>`:`<span><i style="background:var(--acc)"></i>Terjawab</span><span><i></i>Kosong</span>`}<span><i style="background:var(--flag);border-radius:50%"></i>Ragu-ragu</span></div>`;
}
function optionHTML(qi,locked,reveal){
  const q=Q[qi],perm=S.opts[qi],sel=S.ans[qi];
  const texts=[q.a,...q.d.map(d=>d[0])];
  return perm.map((oi,p)=>{
    let c="opt";
    if(reveal){if(oi===0)c+=" right";else if(sel===oi)c+=" wrong"}
    else if(sel===oi)c+=" sel";
    return `<li><button class="${c}" data-o="${oi}" ${locked?"disabled":""}><span class="l">${LET[p]}</span><span>${esc(texts[oi])}</span></button></li>`}).join("");
}
function skdiParts(q){
  let ket="",rel=q.r;
  if(q.s==="—"){const m=q.r.match(/^Non-penyakit:\s*([^.]*)\.?\s*(.*)$/);if(m){ket=m[1];rel=m[2]||("Materi dasar: "+m[1]+".")}}
  return {ket,rel};
}
function expHTML(qi){
  const q=Q[qi],perm=S.opts[qi],texts=[q.a,...q.d.map(d=>d[0])];
  const cp=perm.indexOf(0),sel=S.ans[qi];
  const {ket,rel}=skdiParts(q);
  const wrongs=perm.map((oi,p)=>oi===0?"":`<li><b>${LET[p]}. ${esc(texts[oi])}</b> — ${esc(q.d[oi-1][1])}</li>`).join("");
  const status=sel===undefined?`<span class="res nul">Tidak dijawab</span>`:sel===0?`<span class="res ok">Benar</span>`:`<span class="res bad">Salah</span>`;
  return `<div class="exp"><p>${status}</p>
  <h4>Kunci jawaban</h4><p><span class="key">${LET[cp]}. ${esc(q.a)}</span></p>
  <h4>Level SKDI</h4><p>${q.s==="—"?"— "+(ket?"(non-penyakit: "+esc(ket)+")":"(non-penyakit)"):esc(q.s)}</p>
  <h4>Pembahasan</h4><p><b>Mengapa benar:</b> ${esc(q.w)}</p>
  <p style="margin-top:10px"><b>Mengapa opsi lain salah:</b></p><ul>${wrongs}</ul>
  <h4>Relevansi untuk dokter umum</h4><p>${esc(rel)}</p></div>`;
}
function qHeader(qi,k){const q=Q[qi];return `<div class="meta"><span class="qnum">Soal ${k+1} dari ${Q.length}</span><span class="chip">${esc(q.c)}</span></div>`}
function imgTag(q){return q.img?`<img class="qimg" src="${IMGS[q.img]}" alt="Gambar preparat histologi untuk soal ini">`:""}

function renderExam(){
  const qi=S.order[S.pos],q=Q[qi],locked=isLocked(qi),reveal=S.mode==="latihan"&&S.ans[qi]!==undefined;
  $("#app").innerHTML=`
  <header class="top"><div class="in">
    <div class="brand">${BLOCK}<small>${S.mode==="latihan"?"Mode latihan":"Mode ujian"} · ${Q.length} soal</small></div>
    <div class="timer idle" id="timer">${fmt(S.remaining)}</div>
    <button class="btn navtoggle" id="navt">Nomor</button>
    <button class="btn pri" id="fin">Selesai</button>
  </div></header>
  <div class="wrap"><div class="layout">
    <main><div class="card qcard">
      ${qHeader(qi,S.pos)}
      <p class="qtext">${esc(q.q)}</p>${imgTag(q)}
      <ul class="opts" id="opts">${optionHTML(qi,locked,reveal)}</ul>
      <div class="actions">
        <button class="btn" id="prev" ${S.pos===0?"disabled":""}>Sebelumnya</button>
        <button class="btn flagbtn ${S.flags[qi]?"on":""}" id="flag">${S.flags[qi]?"Ragu-ragu ✓":"Tandai ragu-ragu"}</button>
        ${S.ans[qi]!==undefined&&!locked?`<button class="btn" id="clr">Hapus jawaban</button>`:""}
        <span class="sp"></span>
        <button class="btn pri" id="next" ${S.pos===Q.length-1?"disabled":""}>Berikutnya</button>
      </div>
      ${reveal?expHTML(qi):""}
    </div>
    ${!S.timerStarted?`<p style="color:var(--mute);font-size:13px;margin:10px 4px">Timer belum berjalan. Timer mulai saat kamu memilih jawaban pertama di soal no. 1. Pintasan: huruf A-E untuk memilih, F untuk menandai, tombol panah untuk pindah soal.</p>`:`<p style="color:var(--mute);font-size:13px;margin:10px 4px">Pintasan: huruf A-E untuk memilih, F untuk menandai, tombol panah untuk pindah soal. Progres tersimpan otomatis.</p>`}
    </main>
    <aside class="nav card ${navOpen?"open":""}" id="nav">${navHTML()}</aside>
  </div></div>`;
  updTimer();bindExam();
}
function bindExam(){
  const qi=S.order[S.pos];
  document.querySelectorAll("#opts .opt").forEach(b=>b.onclick=()=>choose(parseInt(b.dataset.o)));
  $("#prev").onclick=()=>go(S.pos-1);$("#next").onclick=()=>go(S.pos+1);
  $("#flag").onclick=()=>{S.flags[qi]?delete S.flags[qi]:(S.flags[qi]=true);save();renderExam()};
  const c=$("#clr");if(c)c.onclick=()=>{delete S.ans[qi];save();renderExam()};
  $("#fin").onclick=confirmFinish;
  $("#navt").onclick=()=>{navOpen=!navOpen;$("#nav").classList.toggle("open",navOpen)};
  document.querySelectorAll("#nav .nb").forEach(b=>b.onclick=()=>{navOpen=false;go(parseInt(b.dataset.k))});
}
function go(k){if(k<0||k>=Q.length)return;S.pos=k;save();renderExam();window.scrollTo({top:0})}
function choose(oi){
  const qi=S.order[S.pos];if(isLocked(qi))return;
  S.ans[qi]=oi;
  if(!S.timerStarted&&S.pos===0){S.timerStarted=true;S.lastTick=Date.now()}
  save();renderExam();
}
function confirmFinish(){
  const un=Q.length-Object.keys(S.ans).length,fl=Object.keys(S.flags).length;
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="card box"><h3>Akhiri ujian?</h3><p style="margin:0;color:var(--mute)">${un?`Masih ada <b>${un}</b> soal belum dijawab. `:"Semua soal sudah dijawab. "}${fl?`<b>${fl}</b> soal masih ditandai ragu-ragu. `:""}Setelah selesai, jawaban tidak bisa diubah.</p><div class="btns"><button class="btn" id="no">Kembali</button><button class="btn danger" id="yes">Akhiri sekarang</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector("#no").onclick=()=>m.remove();
  m.querySelector("#yes").onclick=()=>{m.remove();finish(false)};
}
function finish(auto){S.finished=true;save();view="result";filter="all";renderResult();window.scrollTo({top:0});if(auto)setTimeout(()=>alert("Waktu habis. Ujian diakhiri otomatis."),100)}

/* ---------- RESULT ---------- */
function renderResult(){
  const n=Q.length,ok=correctCount(),ans=Object.keys(S.ans).length,bad=ans-ok,nul=n-ans,pct=Math.round(ok/n*100);
  const cat={};Q.forEach((q,qi)=>{const c=cat[q.c]||(cat[q.c]={t:0,k:0});c.t++;if(S.ans[qi]===0)c.k++});
  const used=S.total-S.remaining;
  const list=S.order.map((qi,k)=>({qi,k})).filter(({qi})=>{
    const a=S.ans[qi];
    return filter==="all"||(filter==="bad"&&a!==undefined&&a!==0)||(filter==="ok"&&a===0)||(filter==="nul"&&a===undefined)||(filter==="flag"&&S.flags[qi]);
  });
  $("#app").innerHTML=`
  <header class="top"><div class="in"><div class="brand">${BLOCK}<small>Hasil ujian</small></div><button class="btn navtoggle" id="navt">Nomor</button><button class="btn" id="home">Beranda</button><button class="btn pri" id="again">Ujian baru</button></div></header>
  <div class="wrap"><div class="layout"><main>
   <div class="card score"><div class="ring" style="--p:${pct}"><div>${pct}</div></div>
    <div style="flex:1;min-width:200px"><h2 style="margin:0 0 4px">Skor ${ok} dari ${n}</h2>
    <div style="color:var(--mute)">Benar ${ok} · Salah ${bad} · Kosong ${nul}<br>Waktu terpakai ${fmt(used)} dari ${fmt(S.total)}</div></div>
    <div class="bars">${Object.entries(cat).map(([k,v])=>`<div class="bar"><div class="t"><span>${esc(k)}</span><span>${v.k}/${v.t}</span></div><div class="b"><i style="width:${v.k/v.t*100}%"></i></div></div>`).join("")}</div></div>
   <div class="filters">${[["all","Semua"],["bad","Salah"],["ok","Benar"],["nul","Kosong"],["flag","Ditandai"]].map(([k,l])=>`<button class="btn ${filter===k?"on":""}" data-f="${k}">${l}</button>`).join("")}</div>
   ${list.length?list.map(({qi,k})=>`<div class="card qcard rev" id="r${k}">${qHeader(qi,k)}<p class="qtext">${esc(Q[qi].q)}</p>${imgTag(Q[qi])}<ul class="opts">${optionHTML(qi,true,true)}</ul>${expHTML(qi)}</div>`).join(""):`<div class="card qcard">Tidak ada soal pada filter ini.</div>`}
  </main><aside class="nav card ${navOpen?"open":""}" id="nav">${navHTML()}</aside></div></div>`;
  $("#home").onclick=()=>{renderStart()};
  $("#again").onclick=()=>{if(confirm("Mulai ujian baru? Hasil ini akan terhapus.")){clearSave();S=null;renderStart()}};
  $("#navt").onclick=()=>{navOpen=!navOpen;$("#nav").classList.toggle("open",navOpen)};
  document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{filter=b.dataset.f;renderResult()});
  document.querySelectorAll("#nav .nb").forEach(b=>b.onclick=()=>{navOpen=false;$("#nav").classList.remove("open");const el=document.getElementById("r"+b.dataset.k);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});else{filter="all";renderResult();setTimeout(()=>{const e=document.getElementById("r"+b.dataset.k);e&&e.scrollIntoView()},50)}});
}

/* ---------- global ---------- */
document.addEventListener("click",e=>{
  if(e.target.classList&&e.target.classList.contains("qimg")){
    const z=document.createElement("div");z.className="zoom";z.innerHTML=`<img src="${e.target.src}" alt="">`;z.onclick=()=>z.remove();document.body.appendChild(z)}
});
document.addEventListener("keydown",e=>{
  if(view!=="exam"||!S||e.ctrlKey||e.metaKey||e.altKey||document.querySelector(".modal"))return;
  if(e.target.tagName==="INPUT")return;
  const k=e.key.toLowerCase(),qi=S.order[S.pos];
  if("abcde".includes(k)&&k.length===1){const p="abcde".indexOf(k);choose(S.opts[qi][p])}
  else if(k==="f"){S.flags[qi]?delete S.flags[qi]:(S.flags[qi]=true);save();renderExam()}
  else if(e.key==="ArrowRight")go(S.pos+1);else if(e.key==="ArrowLeft")go(S.pos-1);
});
window.addEventListener("beforeunload",()=>{if(S)save()});
renderStart();
</script>
</body>
</html>
