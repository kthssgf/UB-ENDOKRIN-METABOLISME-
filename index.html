<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT Blok Endokrin Metabolik</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2333;--mute:#667089;--line:#e2e7f1;--acc:#2f5bea;--acc2:#e8eeff;--ok:#16a06a;--okbg:#e6f7ef;--bad:#d6404f;--badbg:#fdeaec;--flag:#f2a516;--flagbg:#fff4de;--shadow:0 1px 2px rgba(20,30,60,.06),0 6px 20px rgba(20,30,60,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171e2e;--ink:#e8ecf6;--mute:#93a0bd;--line:#26304a;--acc:#6f93ff;--acc2:#1d2a4d;--ok:#37c58d;--okbg:#10301f;--bad:#ff7482;--badbg:#3a1820;--flag:#f5b83d;--flagbg:#3a2d10;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.top .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;padding:6px 12px;border-radius:10px;background:var(--acc2);color:var(--acc);min-width:98px;text-align:center}
.timer.low{background:var(--badbg);color:var(--bad)}
.timer.idle{opacity:.7}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.qcard{padding:22px 24px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--acc2);color:var(--acc)}
.chip.g{background:var(--line);color:var(--mute)}
.qnum{font-weight:700;color:var(--mute);margin-right:auto}
.qtext{font-size:17px;margin:0 0 14px}
.qimg{display:block;max-width:100%;max-height:340px;border-radius:12px;border:1px solid var(--line);margin:0 0 14px;cursor:zoom-in}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);padding:12px 14px;border-radius:12px;transition:.12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--acc2)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--line);color:var(--mute)}
.opt.sel{border-color:var(--acc);background:var(--acc2)}
.opt.sel .l{background:var(--acc);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.actions .sp{flex:1}
.flagbtn.on{background:var(--flagbg);border-color:var(--flag);color:var(--flag)}
.exp{margin-top:18px;border-top:1px dashed var(--line);padding-top:16px}
.exp h4{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.exp p{margin:0 0 6px}
.exp ul{margin:0;padding-left:0;list-style:none;display:grid;gap:6px}
.exp li{padding:8px 12px;border-radius:10px;background:var(--bg);font-size:15px}
.exp li b{color:var(--bad)}
.key{display:inline-block;padding:4px 12px;border-radius:10px;background:var(--okbg);color:var(--ok);font-weight:700}
.res{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px}
.res.ok{background:var(--okbg);color:var(--ok)}.res.bad{background:var(--badbg);color:var(--bad)}.res.nul{background:var(--line);color:var(--mute)}
aside.nav{position:sticky;top:76px;padding:16px}
aside.nav h3{margin:0 0 4px;font-size:15px}
.stat{font-size:13px;color:var(--mute);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;max-height:52vh;overflow:auto;padding:2px}
.nb{position:relative;height:40px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.nb:hover{border-color:var(--acc)}
.nb.ans{background:var(--acc);border-color:var(--acc);color:#fff}
.nb.cur{outline:2.5px solid var(--acc);outline-offset:1px}
.nb.flag::after{content:"";position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--flag);border:2px solid var(--card)}
.nb.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.nb.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mute);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1.5px solid var(--line)}
.navtoggle{display:none}
/* start */
.hero{max-width:720px;margin:28px auto;padding:30px}
.hero h1{margin:0 0 4px;font-size:28px;letter-spacing:-.02em}
.hero p.sub{margin:0 0 20px;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.kpi{padding:12px;border-radius:12px;background:var(--bg);text-align:center}.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:var(--mute)}
.set{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.row small{display:block;color:var(--mute);font-size:13px}
input[type=number]{width:84px;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;text-align:center}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--acc)}.sw input:checked+span::after{left:23px}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
/* result */
.score{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:22px 24px;margin-bottom:16px}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring div{width:92px;height:92px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:26px;font-weight:800}
.bars{flex:1;min-width:240px;display:grid;gap:6px}
.bar{font-size:13px}.bar .t{display:flex;justify-content:space-between}.bar .b{height:7px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:2px}.bar .b i{display:block;height:100%;background:var(--ok)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.filters button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.rev{margin-bottom:16px;scroll-margin-top:84px}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{max-width:420px;width:100%;padding:22px}
.modal h3{margin:0 0 8px}.modal .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:60;display:grid;place-items:center;cursor:zoom-out;padding:16px}.zoom img{max-width:100%;max-height:100%;border-radius:10px}
.foot{max-width:1180px;margin:8px auto 32px;padding:0 16px;color:var(--mute);font-size:12.5px}
@media(max-width:900px){
 .layout{grid-template-columns:1fr}
 aside.nav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;border-radius:18px 18px 0 0;transform:translateY(105%);transition:.2s;max-height:72vh;overflow:auto}
 aside.nav.open{transform:none}
 .navtoggle{display:inline-flex}
 .qcard{padding:16px}.hero{padding:20px;margin:12px auto}.brand small{display:none}
}
@media(max-width:480px){.top .in{gap:8px;padding:8px 12px}.timer{font-size:15px;min-width:84px}.wrap{padding:12px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="foot" id="foot">Level SKDI mengacu pada SKDI 2012 dan perlu dicek ulang dengan buku SKDI institusi. Soal bersumber dari bank soal recall mahasiswa; pembahasan disusun berdasarkan pedoman klinis, bukan dari sumber soal. Tetap rujuk buku teks dan pedoman terbaru.</div>
<script>
const Q=[{"c":"Gizi & Gizi Buruk","q":"Seorang anak laki-laki berusia 8 bulan dipantau dengan diagnosis gizi buruk tanpa komplikasi, nafsu makan baik, dan berobat rawat jalan. Dokter memberikan konseling kepada pengasuh tentang pemberian F100. Berapakah kandungan energi F100?","a":"100 kkal per 100 ml","w":"F100 adalah formula makanan cair berbasis susu, gula, minyak, dan mineral mix dengan densitas energi 100 kkal setiap 100 ml. Formula ini dipakai pada fase rehabilitasi dan pada rawat jalan sesuai Pedoman Tatalaksana Gizi Buruk Kemenkes 2019.","d":[["75 kkal per 100 ml","Ini kandungan F75, formula fase stabilisasi yang rendah osmolaritas dan rendah protein."],["135 kkal per 100 ml","Ini kandungan F135, formula catch-up yang lebih padat energi, bukan F100."],["100 kkal per 1000 ml","Satuannya keliru. Angka 100 kkal per liter sama dengan 10 kkal per 100 ml, jauh di bawah kebutuhan."],["150 kkal per 100 ml","Terlalu padat. Angka ini melampaui densitas formula terapeutik standar dan berisiko beban osmolar."]],"s":"4A","r":"Dokter umum di Puskesmas menangani gizi buruk tanpa komplikasi secara rawat jalan, sehingga harus memahami formula terapeutik dan cara konseling pengasuh."},{"c":"Gizi & Gizi Buruk","q":"Seorang anak perempuan berusia 2 tahun dibawa ibunya karena tubuh kurus, rambut tipis kemerahan, dan edema pada kedua kaki. Tampak bercak eritem kehitaman berbatas tegas dengan skuama yang disebut crazy pavement dermatosis. Kondisi kulit tersebut berkaitan dengan defisiensi mineral apa?","a":"Zink","w":"Gambaran edema, rambut kemerahan, dan crazy pavement dermatosis adalah kwashiorkor. Lesi kulit ini dikaitkan dengan defisiensi zink, di samping protein dan asam lemak esensial, sehingga suplementasi zink termasuk tatalaksana gizi buruk.","d":[["Mangan","Defisiensi mangan tidak menimbulkan dermatosis khas kwashiorkor."],["Kalium","Hipokalemia pada gizi buruk menimbulkan kelemahan dan gangguan irama jantung, bukan lesi kulit khas."],["Kalsium","Defisiensi kalsium berhubungan dengan tetani dan kelainan tulang, bukan dermatosis ini."],["Magnesium","Defisiensi magnesium menyebabkan kelemahan otot dan kejang, bukan lesi crazy pavement."]],"s":"4A","r":"Mengenali tanda khas kwashiorkor memungkinkan dokter layanan primer memberi zink dan merujuk bila ada komplikasi."},{"c":"Gizi & Gizi Buruk","q":"Dalam kerangka penyebab masalah gizi menurut UNICEF, manakah yang termasuk penyebab tidak langsung gizi buruk pada balita?","a":"Pelayanan kesehatan dan lingkungan tidak memadai","w":"Penyebab langsung adalah asupan makanan yang tidak adekuat dan penyakit infeksi. Penyebab tidak langsung mencakup ketahanan pangan keluarga, pola asuh, serta pelayanan kesehatan dan sanitasi lingkungan yang tidak memadai. Penyebab dasarnya adalah kemiskinan dan krisis ekonomi, sosial, atau politik.","d":[["Penyakit infeksi","Infeksi adalah penyebab langsung karena memengaruhi status gizi secara langsung."],["Asupan nutrisi tidak memadai","Asupan yang kurang adalah penyebab langsung."],["Kemiskinan keluarga","Kemiskinan adalah akar masalah pada tingkat dasar, bukan penyebab tidak langsung."],["Krisis ekonomi dan politik","Ini adalah penyebab dasar pada tingkat makro."]],"s":"—","r":"Non-penyakit: kesehatan masyarakat dan gizi. Penting untuk intervensi komprehensif di Puskesmas, yang tidak berhenti pada pemberian makanan."},{"c":"Gizi & Gizi Buruk","q":"Seorang balita berusia 2 tahun ditimbang di Puskesmas. Hasil pengukuran antropometri menunjukkan BB/TB berada di antara -3 SD dan -2 SD tanpa edema dan tanpa komplikasi. Tatalaksana yang tepat adalah","a":"Pemberian makanan tambahan pemulihan","w":"BB/TB -3 SD sampai kurang dari -2 SD termasuk gizi kurang, wasting sedang. Tatalaksananya adalah pemberian makanan tambahan pemulihan sambil memantau pertumbuhan, dengan konseling gizi dan penanganan penyakit penyerta.","d":[["Rawat inap fase stabilisasi dengan F75","Ini untuk gizi buruk dengan komplikasi, bukan gizi kurang."],["Rawat jalan dengan F100 atau RUTF","Ini untuk gizi buruk tanpa komplikasi, yaitu BB/TB kurang dari -3 SD."],["Suplementasi vitamin A saja","Tidak cukup, karena defisit energi dan protein tetap tidak tertangani."],["Observasi tanpa intervensi","Tidak tepat, karena anak sudah berada dalam kategori kurang gizi yang memerlukan intervensi."]],"s":"4A","r":"Dokter umum berperan menentukan status gizi dan jalur tatalaksana, yaitu PMT, rawat jalan, atau rawat inap."},{"c":"Gizi & Gizi Buruk","q":"Seorang anak berusia 18 bulan diperiksa di Posyandu. Lingkar lengan atas 11 cm dan BB/TB kurang dari -3 SD. Bagaimana status gizi anak tersebut?","a":"Gizi buruk","w":"Kriteria gizi buruk atau severe acute malnutrition meliputi BB/TB kurang dari -3 SD, atau LILA kurang dari 11,5 cm pada anak 6-59 bulan, atau edema pada kedua punggung kaki. Anak ini memenuhi dua kriteria sekaligus.","d":[["Gizi kurang","Gizi kurang berada pada BB/TB -3 SD sampai kurang dari -2 SD, dan LILA 11,5 sampai kurang dari 12,5 cm."],["Gizi baik","Gizi baik memiliki BB/TB -2 SD sampai +1 SD."],["Berisiko gizi lebih","Kategori ini memiliki BB/TB lebih dari +1 SD."],["Gizi lebih","Kategori ini memiliki BB/TB lebih dari +2 SD."]],"s":"4A","r":"Penapisan LILA dan BB/TB adalah kompetensi dasar dokter layanan primer."},{"c":"Gizi & Gizi Buruk","q":"Seorang anak berusia 4 tahun memiliki BB 11,5 kg dan TB 96 cm. Hasil plotting menunjukkan BB/TB z-score = -3. Bagaimana interpretasinya?","a":"Wasting berat","w":"BB/TB z-score kurang dari -3 SD adalah wasting berat atau gizi buruk. Penilaian BB/TB mencerminkan malnutrisi akut.","d":[["Normal","Normal bila BB/TB berada di antara -2 SD dan +1 SD."],["Underweight","Underweight dinilai dari BB/U, bukan BB/TB."],["Stunting","Stunting dinilai dari TB/U, yang mencerminkan malnutrisi kronik."],["Wasting sedang","Wasting sedang bila BB/TB -3 SD sampai kurang dari -2 SD."]],"s":"4A","r":"Interpretasi indeks antropometri yang tepat menentukan jenis intervensi."},{"c":"Gizi & Gizi Buruk","q":"Seorang ibu membawa anaknya ke Posyandu. Pada pemeriksaan KMS, titik berat badan anak berada di bawah garis kuning, tetapi masih di atas garis merah. Apa artinya?","a":"Gizi kurang","w":"Pada KMS, titik di bawah garis kuning menandakan gizi kurang. Titik di bawah garis merah atau BGM menandakan risiko gizi buruk. KMS memantau tren pertumbuhan, dan Buku KIA terbaru memakai pita z-score.","d":[["Gizi baik","Gizi baik berada pada pita hijau di atas garis kuning."],["Gizi sedang","Tidak ada kategori gizi sedang pada interpretasi KMS."],["Gizi buruk","Gizi buruk atau BGM berada di bawah garis merah."],["Gizi lebih","Gizi lebih berada di atas pita hijau, bukan di bawah garis kuning."]],"s":"4A","r":"Dokter layanan primer perlu membaca KMS untuk deteksi dini gangguan pertumbuhan."},{"c":"Gizi & Gizi Buruk","q":"Seorang balita dengan gizi buruk datang dalam keadaan sadar tetapi lemah. Pemeriksaan gula darah menunjukkan hipoglikemia. Bagaimana tatalaksana awal yang tepat?","a":"Berikan 50 ml larutan glukosa 10 persen per oral atau selang nasogastrik","w":"Hipoglikemia pada gizi buruk yang masih sadar ditangani dengan larutan glukosa atau gula 10 persen sebanyak 50 ml per oral atau NGT, dilanjutkan pemberian makan atau F75 setiap 2 jam.","d":[["Berikan bolus dekstrosa 10 persen intravena 5 ml per kgBB","Rute IV dipakai bila anak tidak sadar atau letargis."],["Berikan infus Ringer laktat 20 ml per kgBB","Cairan ini tidak mengoreksi hipoglikemia dan berisiko overload pada gizi buruk."],["Berikan insulin subkutan","Insulin akan memperburuk hipoglikemia."],["Tunda terapi sampai kadar glukosa diperiksa ulang","Menunda terapi berbahaya karena hipoglikemia dapat menyebabkan kejang dan kematian."]],"s":"4A","r":"Hipoglikemia adalah penyebab kematian dini pada gizi buruk dan harus ditangani segera di fasilitas primer."},{"c":"Gizi & Gizi Buruk","q":"Seorang balita gizi buruk ditemukan tidak sadar di IGD. Pemeriksaan gula darah menunjukkan hipoglikemia. Terapi yang tepat adalah","a":"Dekstrosa 10 persen intravena 5 ml per kgBB","w":"Pada hipoglikemia dengan penurunan kesadaran atau letargi, berikan bolus IV dekstrosa 10 persen 5 ml per kgBB. Setelah itu lanjutkan larutan gula atau F75 per oral atau NGT begitu anak sadar.","d":[["Dekstrosa 5 persen intravena 5 ml per kgBB","Konsentrasi 5 persen kurang adekuat untuk mengoreksi hipoglikemia akut pada anak."],["Larutan gula 10 persen per oral","Pada anak tidak sadar, rute oral berisiko aspirasi."],["Infus Ringer laktat saja","Tidak mengoreksi hipoglikemia."],["NaCl 0,9 persen bolus","Tidak mengandung glukosa dan berisiko overload cairan."]],"s":"4A","r":"Kegawatan gizi buruk yang wajib dikuasai dokter umum."},{"c":"Gizi & Gizi Buruk","q":"Seorang anak laki-laki berusia 3 tahun dengan marasmus datang dengan keluhan tidak dapat melihat saat senja hari. Wajahnya tampak seperti orang tua. Dokter memutuskan memberikan vitamin A. Regimen yang tepat adalah","a":"Kapsul merah hari 1, 2, dan 15","w":"Pada gizi buruk dengan tanda xeroftalmia seperti rabun senja, vitamin A diberikan pada hari 1, 2, dan 15 menurut tatalaksana gizi buruk Kemenkes. Anak 12-59 bulan mendapat kapsul merah 200.000 IU.","d":[["Kapsul biru hari 1, 2, dan 15","Kapsul biru 100.000 IU untuk bayi 6-11 bulan, sedangkan anak ini 3 tahun."],["Kapsul merah dosis tunggal pada hari pertama","Dosis tunggal adalah untuk suplementasi rutin, bukan terapi xeroftalmia."],["Kapsul biru dosis tunggal pada hari pertama","Warna kapsul dan jadwal sama-sama tidak sesuai."],["Kapsul merah setiap hari selama 2 minggu","Tidak sesuai jadwal baku dan berisiko kelebihan dosis."]],"s":"4A","r":"Defisiensi vitamin A masih menjadi masalah pada balita gizi buruk dan penanganannya adalah kompetensi dokter layanan primer."},{"c":"Gizi & Gizi Buruk","q":"Seorang peneliti gizi ingin menggali asupan makanan individu melalui wawancara tentang semua makanan dan minuman yang dikonsumsi dalam 24 jam terakhir. Metode survei konsumsi yang sesuai adalah","a":"Food recall 24 jam","w":"Food recall 24 jam mewawancarai responden tentang semua makanan dan minuman yang dikonsumsi pada 24 jam sebelumnya, dengan estimasi porsi memakai alat bantu ukuran rumah tangga.","d":[["Dietary history","Dietary history menelusuri pola makan jangka panjang secara komprehensif, bukan 24 jam terakhir."],["Food frequency questionnaire","Metode ini mencatat frekuensi konsumsi bahan makanan dalam periode tertentu, misalnya seminggu atau sebulan."],["Food weighing","Metode ini menimbang makanan secara langsung selama periode pengamatan."],["Food record","Metode ini adalah pencatatan prospektif oleh responden sendiri selama beberapa hari."]],"s":"—","r":"Non-penyakit: penilaian konsumsi pangan dalam survei gizi dan konseling diet."},{"c":"Gizi & Gizi Buruk","q":"Seorang anak berusia 10 tahun datang dengan keluhan ringan. Nafsu makan baik dan tidak ada penyakit kronik. Dokter ingin menilai status gizi anak melalui IMT menurut umur. Kurva yang digunakan menurut materi kuliah adalah","a":"Kurva CDC 2000","w":"Materi kuliah, yang bersumber dari rekomendasi IDAI, memakai IMT CDC 2000 untuk anak usia 2-18 tahun, sedangkan WHO 2006 dipakai untuk usia kurang dari 2 tahun. Perlu dicatat bahwa Permenkes No. 2/2020 memakai standar WHO 2007 untuk anak 5-18 tahun, jadi rujuk pedoman yang berlaku di institusi.","d":[["Kurva Tanner","Tanner menilai tahap pubertas, bukan status gizi."],["Kurva WHO 2006","Kurva ini untuk anak kurang dari 5 tahun."],["Kurva WHO 2005","Bukan kurva baku yang dipakai untuk menilai IMT anak pada materi ini."],["Kurva NCHS 1977","Kurva lama yang sudah digantikan oleh CDC 2000 dan WHO."]],"s":"—","r":"Non-penyakit: antropometri. Pemilihan kurva menentukan klasifikasi gizi anak."},{"c":"Tumbuh Kembang","q":"Seorang anak berusia 7 tahun dibawa ibunya ke fasilitas kesehatan primer karena merasa anaknya lebih pendek dibandingkan teman-temannya. Berapakah kecepatan pertumbuhan tinggi badan normal pada masa prapubertas?","a":"5-5,5 cm per tahun","w":"Menurut Nwosu dkk dan IDAI, kecepatan pertumbuhan masa prapubertas adalah 5-5,5 cm per tahun, sedangkan usia 2-5 tahun 6-7 cm per tahun.","d":[["6-7 cm per tahun","Ini kecepatan pertumbuhan usia 2-5 tahun."],["8-12 cm per tahun","Ini kecepatan saat pubertas pada perempuan."],["10-14 cm per tahun","Ini kecepatan usia 1-2 tahun, atau pubertas pada laki-laki."],["23-27 cm per tahun","Ini kecepatan pertumbuhan pada tahun pertama kehidupan."]],"s":"—","r":"Non-penyakit: menilai kecepatan pertumbuhan adalah langkah pertama pendekatan perawakan pendek."},{"c":"Tumbuh Kembang","q":"Seorang ibu membawa anaknya yang berperawakan pendek dibandingkan teman sebaya. Kecepatan pertumbuhan normal, tidak ada edema, iga gambang, ataupun wajah tua. Ayah dan kakek anak juga bertubuh pendek. Usia tulang sama dengan usia kronologis. Diagnosis yang paling mungkin adalah","a":"Familial short stature","w":"Kecepatan tumbuh normal, usia tulang sama dengan usia kronologis, tinggi dewasa kurang dari P3, dan sesuai potensi genetik adalah ciri familial short stature dalam alur diagnosis perawakan pendek.","d":[["Constitutional delay of growth and puberty","CDGP memiliki usia tulang yang tertinggal dari usia kronologis."],["Defisiensi hormon pertumbuhan","Pada defisiensi GH, kecepatan tumbuh menurun, bukan normal."],["Stunting","Stunting adalah akibat malnutrisi kronik dan biasanya disertai riwayat gizi buruk."],["Wasting","Wasting dinilai dari BB/TB dan menggambarkan malnutrisi akut, bukan perawakan pendek yang normal."]],"s":"3A","r":"Dokter umum menyaring dan mengedukasi varian normal, serta merujuk kelainan patologis."},{"c":"Tumbuh Kembang","q":"Seorang anak berusia 12 tahun datang dengan keluhan bertubuh pendek dibandingkan teman seusianya. Usia tulang lebih muda daripada usia kronologis. Ayahnya mengalami keterlambatan pubertas. Kecepatan pertumbuhan normal. Diagnosis yang paling mungkin adalah","a":"Constitutional delay of growth and puberty","w":"Pada CDGP, usia tulang lebih muda daripada usia kronologis, tinggi dewasa akhir normal, dan terdapat riwayat keluarga keterlambatan pubertas. Ini adalah varian normal.","d":[["Familial short stature","Usia tulang sama dengan usia kronologis pada kondisi ini."],["Stunting","Tidak ada riwayat malnutrisi kronik pada anak ini."],["Perawakan pendek disproporsional","Tidak ada kelainan rasio segmen tubuh pada vignette."],["Wasting","Wasting menggambarkan malnutrisi akut, bukan pendek dengan usia tulang tertinggal."]],"s":"3A","r":"Dokter umum mengedukasi orang tua dan memantau bila tidak ada tanda kelainan patologis."},{"c":"Tumbuh Kembang","q":"Seorang anak laki-laki berusia 13 tahun dibawa ibunya ke klinik karena paling pendek di antara teman-temannya. Untuk memastikan apakah anak termasuk perawakan pendek, dilakukan pengukuran tinggi badan. Kriteria perawakan pendek adalah","a":"TB/U kurang dari -2 SD kurva WHO 2007 atau TB/U kurang dari P3 kurva CDC 2000","w":"Perawakan pendek didefinisikan sebagai tinggi badan di bawah -2 SD atau di bawah persentil 3 kurva yang berlaku menurut usia dan jenis kelamin. Indeks yang dipakai adalah TB/U, bukan BB/TB.","d":[["TB/U kurang dari -3 SD kurva WHO 2007 atau TB/U kurang dari P3 kurva CDC 2000","Ambang -3 SD adalah sangat pendek atau stunting berat, bukan batas definisi."],["BB/TB kurang dari -3 SD kurva WHO 2007 atau BB/TB kurang dari P3 kurva CDC 2000","BB/TB menilai proporsi berat terhadap tinggi, bukan tinggi menurut usia."],["BB/TB kurang dari -2 SD kurva WHO 2007 atau BB/TB kurang dari P3 kurva CDC 2000","BB/TB adalah indeks yang salah untuk menilai perawakan pendek."],["TB/U kurang dari -1 SD kurva WHO 2007 atau TB/U kurang dari P10 kurva CDC 2000","Ambang ini masih masuk rentang normal."]],"s":"—","r":"Non-penyakit: kriteria perawakan pendek menentukan kapan evaluasi lanjut diperlukan."},{"c":"Tumbuh Kembang","q":"Seorang anak berperawakan pendek dibawa ke poliklinik. Dokter ingin menentukan apakah anak termasuk perawakan pendek proporsional atau disproporsional. Pemeriksaan yang digunakan adalah","a":"Rasio segmen atas terhadap segmen bawah tubuh","w":"Proporsionalitas tubuh dinilai dari rasio segmen atas dan segmen bawah, yang berubah menurut usia. Disproporsi mengarahkan ke kelainan skeletal seperti akondroplasia.","d":[["Tinggi badan menurut umur","TB/U hanya menilai pendek atau tidaknya, bukan proporsi."],["Berat badan menurut umur","Parameter ini tidak menilai proporsi segmen tubuh."],["Indeks massa tubuh","IMT menilai status gizi, bukan proporsi tubuh."],["Usia tulang","Usia tulang menilai maturitas skeletal, bukan proporsi segmen."]],"s":"—","r":"Non-penyakit: alur diagnostik perawakan pendek menurut IDAI."},{"c":"Tumbuh Kembang","q":"Seorang laki-laki dewasa muda ingin menghitung tinggi potensial genetiknya berdasarkan tinggi badan orang tua. Rumus yang benar adalah","a":"Laki-laki: tinggi badan ayah ditambah tinggi badan ibu ditambah 13, dibagi 2","w":"Tinggi potensial genetik anak laki-laki adalah rata-rata tinggi orang tua ditambah 6,5 cm, yaitu TB ayah + TB ibu + 13, dibagi 2. Untuk perempuan, 13 cm dikurangkan.","d":[["Laki-laki: tinggi badan ayah ditambah tinggi badan ibu ditambah 13, dikali 2","Dikali 2 menghasilkan angka yang tidak realistis."],["Laki-laki: tinggi badan ayah dikurangi tinggi badan ibu dikurangi 13, dikali 2","Rumus ini salah operasi dan salah faktor."],["Perempuan: tinggi badan ayah ditambah tinggi badan ibu ditambah 13, dibagi 2","Pada perempuan, 13 cm dikurangkan, bukan ditambahkan."],["Perempuan: tinggi badan ayah ditambah tinggi badan ibu dikurangi 13, dibagi 2","Rumus ini benar untuk perempuan, tetapi pasien ini laki-laki."]],"s":"—","r":"Non-penyakit: mid-parental height membantu membedakan varian normal dari perawakan pendek patologis."},{"c":"Diabetes Melitus","q":"Kadar gula darah meningkat setelah makan dan memicu berbagai reaksi metabolik. Apakah peran utama insulin pada keadaan ini?","a":"Meningkatkan sintesis dan penyimpanan glikogen di otot dan hati","w":"Insulin adalah hormon anabolik pada keadaan kenyang. Ia meningkatkan ambilan glukosa lewat GLUT4 di otot dan lemak, merangsang glikogenesis di otot dan hati, serta sintesis lemak dan protein.","d":[["Meningkatkan glikolisis dan glukoneogenesis hepar","Insulin meningkatkan glikolisis tetapi menekan glukoneogenesis."],["Menghambat pemanfaatan glikogen oleh otot","Pernyataan ini tidak menggambarkan peran utama insulin, yang justru mendorong pembentukan glikogen."],["Meningkatkan lipolisis oleh jaringan adiposa","Insulin menghambat lipolisis dan meningkatkan lipogenesis."],["Meningkatkan sekresi hormon glukagon","Insulin menekan sekresi glukagon."]],"s":"—","r":"Non-penyakit: fisiologi insulin menjadi dasar memahami patofisiologi dan terapi DM."},{"c":"Diabetes Melitus","q":"Seorang laki-laki dewasa datang dengan kadar gula darah sewaktu dan gula darah puasa yang tinggi. Tidak ada riwayat penyakit atau infeksi sebelumnya. Patofisiologi yang paling mendasari kondisi ini adalah","a":"Defisiensi insulin relatif","w":"Pada DM tipe 2 terjadi resistensi insulin disertai gangguan fungsi sel beta, sehingga insulin tidak cukup untuk mengatasi resistensi. Hasilnya adalah defisiensi insulin relatif.","d":[["Kerusakan autoimun sel beta pankreas","Ini patofisiologi DM tipe 1, yang khas pada usia muda dengan onset akut."],["Defisiensi insulin absolut akibat pankreatitis kronik","Tidak ada riwayat penyakit pankreas pada pasien."],["Produksi glukagon yang berlebihan oleh sel alfa pankreas","Ini kontributor, tetapi bukan mekanisme dasar DM tipe 2."],["Defek reseptor insulin akibat mutasi genetik langka","Penyebab ini sangat jarang, sedangkan DM tipe 2 yang umum bersifat poligenik."]],"s":"4A","r":"Memahami patofisiologi membantu memilih terapi yang tepat, yaitu insulin sensitizer untuk DM tipe 2."},{"c":"Diabetes Melitus","q":"Seorang anak laki-laki berusia 12 tahun didiagnosis diabetes melitus tipe 1. Manakah patofisiologi yang mendasarinya?","a":"Antibodi merusak sel beta pankreas","w":"DM tipe 1 disebabkan destruksi autoimun sel beta pankreas, dengan autoantibodi seperti ICA, GAD65, dan IAA, pada individu dengan kerentanan HLA kelas II. Akibatnya terjadi defisiensi insulin absolut.","d":[["Defisiensi insulin relatif","Ini mekanisme DM tipe 2."],["Hambatan sekresi glukagon","Bukan mekanisme DM tipe 1."],["Resistensi insulin di jaringan perifer","Ini ciri DM tipe 2, bukan penyebab utama DM tipe 1."],["Peningkatan penyerapan glukosa di usus","Bukan mekanisme DM tipe 1."]],"s":"3A","r":"Dokter umum mendiagnosis DM tipe 1, memulai insulin, dan merujuk."},{"c":"Diabetes Melitus","q":"Seorang laki-laki berusia 30 tahun, IMT 19 kg/m2, datang dengan penurunan berat badan 7 kg dalam 1 bulan, sering buang air kecil, mudah haus, dan mudah lapar. Tidak ada riwayat keluarga DM. Pemeriksaan fisik dan tanda vital normal. Gula darah puasa 168 mg/dL dan HbA1c 8,2 persen. Diagnosis yang paling mungkin adalah","a":"Diabetes melitus tipe 1","w":"Onset akut pada usia muda dengan penurunan berat badan cepat, IMT rendah, dan polidipsia, poliuria, polifagia mengarah ke DM tipe 1 akibat defisiensi insulin absolut.","d":[["Diabetes melitus tipe 2","Biasanya terjadi pada usia lebih tua dengan obesitas dan onset perlahan."],["Maturity onset diabetes of the young","Diwariskan autosomal dominan, jadi biasanya ada riwayat keluarga kuat dan onset tidak akut dengan penurunan berat badan drastis."],["Latent autoimmune diabetes in adults","Onset umumnya setelah usia 30 tahun dan perjalanannya lebih lambat."],["Diabetes sekunder akibat pankreatitis kronik","Tidak ada riwayat penyakit pankreas atau alkohol."]],"s":"3A","r":"Dokter umum mengenali DM tipe 1 dan memulai tatalaksana awal sebelum merujuk."},{"c":"Diabetes Melitus","q":"Seorang laki-laki berusia 30 tahun, IMT 19 kg/m2, didiagnosis diabetes melitus tipe 1 dengan penurunan berat badan 7 kg dalam 1 bulan, gula darah puasa 168 mg/dL, dan HbA1c 8,2 persen. Terapi yang tepat adalah","a":"Insulin","w":"Penyandang DM tipe 1 memiliki defisiensi insulin absolut sehingga insulin adalah terapi utama dan wajib.","d":[["Metformin","Metformin mengurangi resistensi insulin, sehingga tidak cukup pada defisiensi absolut."],["Glibenklamid","Sulfonilurea membutuhkan sel beta yang masih berfungsi, yang tidak ada pada DM tipe 1."],["Akarbosa","Hanya menurunkan hiperglikemia pascaprandial, tidak menggantikan insulin."],["Pioglitazon","Meningkatkan sensitivitas insulin, tidak berguna tanpa insulin endogen."]],"s":"3A","r":"Dokter umum memulai insulin dan edukasi, termasuk pemantauan mandiri dan pencegahan hipoglikemia."},{"c":"Diabetes Melitus","q":"Seorang laki-laki berusia 52 tahun dengan berat badan berlebih mengeluh sering buang air kecil pada malam hari, rasa haus, serta berat badan turun meskipun makan banyak. Gula darah sewaktu 200 mg/dL. Diagnosis yang paling mungkin adalah","a":"Diabetes melitus","w":"Gejala klasik DM disertai glukosa plasma sewaktu 200 mg/dL atau lebih memenuhi kriteria diagnosis DM. Pada usia ini dan berat badan berlebih, tipe 2 paling mungkin.","d":[["Diabetes insipidus","Poliuria pada DI disebabkan defisiensi ADH atau resistensi ginjal dengan glukosa darah normal."],["Hipertiroidisme","Bisa menurunkan berat badan, tetapi tidak menyebabkan GDS 200 mg/dL dengan poliuria."],["Dislipidemia","Dislipidemia tidak bergejala klasik seperti poliuria dan polidipsia."],["Sindrom Cushing","Hiperglikemia bisa muncul, tetapi gambaran klinisnya adalah obesitas sentral, striae, dan moon face."]],"s":"4A","r":"Diagnosis DM tipe 2 adalah kompetensi penuh dokter layanan primer."},{"c":"Diabetes Melitus","q":"Edukasi gizi pada penyandang diabetes melitus menganjurkan karbohidrat dengan indeks glikemik tertentu. Berapakah indeks glikemik yang dianjurkan?","a":"Di bawah 55","w":"Makanan indeks glikemik rendah, yaitu 55 atau kurang, menyebabkan kenaikan glukosa pascaprandial yang lebih landai dan dianjurkan pada penyandang DM.","d":[["Lebih dari 80","Ini kategori IG tinggi, yang menaikkan glukosa darah cepat."],["80-90","Termasuk IG tinggi."],["60-70","Termasuk IG sedang, bukan yang dianjurkan."],["70-80","Termasuk IG tinggi."]],"s":"—","r":"Non-penyakit: edukasi gizi DM adalah bagian pilar tatalaksana."},{"c":"Diabetes Melitus","q":"Seorang laki-laki berusia 55 tahun dengan DM tipe 2 ingin memperbaiki pola makannya. Pola makan yang dianjurkan adalah","a":"Karbohidrat kompleks berserat dan lemak tidak jenuh","w":"Pola makan DM menekankan karbohidrat kompleks berserat dengan indeks glikemik rendah, lemak tidak jenuh seperti MUFA dan PUFA, serta protein cukup. Lemak jenuh dan gula sederhana dibatasi.","d":[["Tinggi lemak jenuh","Lemak jenuh meningkatkan risiko kardiovaskular dan memperburuk resistensi insulin."],["Rendah serat dan tinggi karbohidrat sederhana","Menaikkan glukosa postprandial dengan cepat."],["Tinggi protein hewani","Tidak dianjurkan sebagai pola utama, terutama bila ada risiko nefropati."],["Puasa total berkepanjangan","Berisiko hipoglikemia pada pengguna obat dan tidak dianjurkan."]],"s":"—","r":"Non-penyakit: terapi nutrisi medis adalah pilar tatalaksana DM."},{"c":"Diabetes Melitus","q":"Manakah obat antihiperglikemik oral berikut yang menurunkan HbA1c paling besar?","a":"Biguanid atau metformin","w":"Metformin menurunkan HbA1c sekitar 1-2 persen dan menjadi lini pertama DM tipe 2. Sulfonilurea memberi efek serupa tetapi tidak termasuk pada pilihan di sini.","d":[["Tiazolidindion","Menurunkan HbA1c sekitar 0,5-1,4 persen, lebih kecil dari metformin."],["Penghambat alfa glukosidase","Menurunkan HbA1c sekitar 0,5-0,8 persen."],["Penghambat DPP-4","Menurunkan HbA1c sekitar 0,5-0,9 persen."],["Penghambat SGLT-2","Menurunkan HbA1c sekitar 0,5-0,9 persen, dengan manfaat kardiorenal."]],"s":"—","r":"Non-penyakit: farmakologi DM. Pemilihan terapi sesuai efektivitas dan keamanan."},{"c":"Diabetes Melitus","q":"Seorang laki-laki berusia 58 tahun datang dengan keluhan sering buang air kecil, rasa haus, dan penurunan berat badan signifikan. Gula darah sewaktu 335 mg/dL. Dokter meresepkan metformin. Berapakah dosis awal menurut materi kuliah?","a":"2 x 500 mg","w":"Menurut materi kuliah, metformin tersedia sebagai tablet 500 dan 850 mg dengan dosis awal 2 x 500 mg, pemeliharaan 3 x 500 mg, dan dosis maksimal 2,5 gram per hari. Pedoman lain memulai dari 500 mg satu atau dua kali sehari lalu dititrasi.","d":[["1 x 100 mg","Dosis ini tidak tersedia dan terlalu rendah."],["3 x 100 mg","Dosis ini tidak tersedia dan terlalu rendah."],["2 x 200 mg","Sediaan 200 mg tidak ada, sehingga dosis ini tidak dipakai."],["3 x 300 mg","Sediaan 300 mg tidak ada, sehingga dosis ini tidak dipakai."]],"s":"4A","r":"Dokter umum meresepkan metformin dengan dosis awal rendah yang dititrasi bertahap untuk mengurangi efek gastrointestinal."},{"c":"Diabetes Melitus","q":"Manakah kondisi berikut yang merupakan kontraindikasi pemakaian metformin?","a":"Penyakit ginjal kronik stadium 4-5","w":"Metformin tidak direkomendasikan pada eGFR kurang dari 30 mL/menit/1,73 m2, yaitu CKD stadium 4-5, karena meningkatkan risiko asidosis laktat. Kontraindikasi lain adalah gangguan hati berat, gagal jantung dekompensasi, dan hipoksia.","d":[["Penyakit ginjal kronik stadium 1","Fungsi ginjal masih normal, sehingga metformin boleh digunakan."],["Obesitas dengan DM tipe 2","Ini indikasi utama metformin."],["Hipertensi terkontrol","Bukan kontraindikasi."],["Sindrom ovarium polikistik dengan resistensi insulin","Bukan kontraindikasi, bahkan metformin dipakai sebagai terapi tambahan."]],"s":"4A","r":"Dokter umum wajib memeriksa fungsi ginjal sebelum dan selama pemberian metformin."},{"c":"Diabetes Melitus","q":"Seorang pasien DM tipe 2 diberi acarbose. Bagaimana mekanisme kerja obat ini?","a":"Menghambat penyerapan glukosa di usus halus","w":"Acarbose adalah inhibitor alfa glukosidase yang menghambat pemecahan karbohidrat kompleks, sehingga penyerapan glukosa di usus halus tertunda dan hiperglikemia pascaprandial turun.","d":[["Meningkatkan sekresi insulin dari sel beta pankreas","Itu mekanisme sulfonilurea dan glinid."],["Meningkatkan sensitivitas insulin di jaringan perifer","Itu mekanisme metformin dan tiazolidindion."],["Menghambat reabsorpsi glukosa di tubulus proksimal ginjal","Itu mekanisme penghambat SGLT-2."],["Meningkatkan kadar hormon inkretin","Itu mekanisme penghambat DPP-4."]],"s":"—","r":"Non-penyakit: farmakologi DM. Penting untuk memahami efek samping seperti flatulens."},{"c":"Diabetes Melitus","q":"Manakah golongan obat antidiabetik berikut yang bekerja menghambat absorpsi glukosa di usus halus?","a":"Penghambat alfa glukosidase","w":"Penghambat alfa glukosidase seperti acarbose dan voglibose menghambat enzim brush border yang menguraikan karbohidrat menjadi monosakarida.","d":[["Biguanid","Menekan produksi glukosa hati dan meningkatkan sensitivitas insulin."],["Penghambat DPP-4","Meningkatkan inkretin endogen."],["Sulfonilurea","Merangsang sekresi insulin."],["Tiazolidindion","Meningkatkan sensitivitas insulin lewat PPAR gamma."]],"s":"—","r":"Non-penyakit: farmakologi DM."},{"c":"Diabetes Melitus","q":"Manakah obat antidiabetik oral berikut yang bekerja meningkatkan sekresi insulin?","a":"Sulfonilurea","w":"Sulfonilurea menutup kanal K-ATP sel beta, menyebabkan depolarisasi dan eksositosis insulin.","d":[["Metformin","Menurunkan produksi glukosa hati dan meningkatkan sensitivitas insulin."],["Pioglitazon","Meningkatkan sensitivitas insulin."],["Akarbosa","Menghambat penyerapan karbohidrat di usus."],["Dapagliflozin","Meningkatkan ekskresi glukosa lewat urin."]],"s":"—","r":"Non-penyakit: farmakologi DM."},{"c":"Diabetes Melitus","q":"Seorang laki-laki berusia 70 tahun dengan DM tipe 2 diberi glibenklamid. Apakah efek samping yang paling perlu diwaspadai pada pasien ini?","a":"Hipoglikemia berat","w":"Sulfonilurea, terutama glibenklamid, berisiko menyebabkan hipoglikemia berat dan berkepanjangan pada lansia, terutama bila fungsi ginjal atau hati terganggu.","d":[["Asidosis laktat","Ini risiko metformin."],["Edema perifer","Ini efek tiazolidindion."],["Flatulensi","Ini efek samping inhibitor alfa glukosidase."],["Infeksi saluran kemih genital","Ini efek penghambat SGLT-2."]],"s":"4A","r":"Dokter umum harus waspada hipoglikemia pada lansia yang memakai sulfonilurea."},{"c":"Diabetes Melitus","q":"Seorang pasien DM tipe 2 diresepkan glikuidon. Kapankah waktu pemberian yang tepat?","a":"Sebelum makan","w":"Sulfonilurea seperti glikuidon diminum sebelum makan sehingga puncak kerjanya bertepatan dengan kenaikan glukosa pascaprandial.","d":[["Sebelum tidur","Tidak sesuai karena meningkatkan risiko hipoglikemia nokturnal."],["Setelah makan","Puncak kerja obat tidak bertepatan dengan kenaikan glukosa."],["Di antara suapan makan","Cara ini untuk acarbose, bukan sulfonilurea."],["Bersamaan dengan insulin basal malam hari","Tidak ada indikasi dan berisiko hipoglikemia."]],"s":"—","r":"Non-penyakit: farmakologi DM. Waktu minum obat menentukan efektivitas dan keamanan."},{"c":"Diabetes Melitus","q":"Manakah pasien DM berikut yang tidak boleh diberikan sulfonilurea?","a":"Wanita hamil dengan diabetes","w":"Sulfonilurea tidak boleh diberikan pada DM tipe 1 atau juvenil, DM berat dengan kebutuhan insulin tidak stabil, DM pada kehamilan, dan keadaan gawat. Pada kehamilan, insulin menjadi pilihan.","d":[["Laki-laki 50 tahun dengan DM tipe 2 dan HbA1c 8 persen","Sulfonilurea dapat dipakai pada DM tipe 2 dewasa."],["Wanita 45 tahun dengan DM tipe 2 tanpa komplikasi","Boleh diberikan dengan pemantauan."],["Laki-laki 60 tahun dengan DM tipe 2 dan neuropati ringan","Boleh digunakan dengan kewaspadaan terhadap hipoglikemia."],["Laki-laki 55 tahun dengan DM tipe 2 gagal metformin","Penambahan sulfonilurea adalah salah satu pilihan."]],"s":"4A","r":"Dokter umum harus memahami kontraindikasi sulfonilurea."},{"c":"Diabetes Melitus","q":"Gen manakah yang paling kuat berhubungan dengan kerentanan diabetes melitus tipe 2?","a":"TCF7L2","w":"TCF7L2 adalah gen kandidat paling kuat dan konsisten yang berhubungan dengan kerentanan DM tipe 2 pada berbagai etnis.","d":[["IDDM1","Lokus ini berhubungan dengan DM tipe 1."],["IDDM2","Lokus gen insulin untuk DM tipe 1."],["PPARG","Berhubungan dengan DM tipe 2 tetapi efeknya lebih lemah."],["KCNJ11","Berhubungan dengan DM tipe 2 tetapi efeknya lebih lemah."]],"s":"—","r":"Non-penyakit: genetika molekuler DM."},{"c":"Diabetes Melitus","q":"Gen atau lokus manakah yang paling dominan berhubungan dengan diabetes melitus tipe 1?","a":"HLA kelas II","w":"Kerentanan genetik DM tipe 1 terutama berasal dari gen HLA kelas II, terutama HLA-DR3, DR4, dan DQ, pada lokus IDDM1.","d":[["TCF7L2","Dominan pada DM tipe 2."],["PPARG","Berhubungan dengan DM tipe 2."],["KCNJ11","Berhubungan dengan DM tipe 2 dan diabetes neonatal."],["CAPN10","Berhubungan dengan DM tipe 2."]],"s":"—","r":"Non-penyakit: genetika molekuler DM."},{"c":"Diabetes Melitus","q":"Seorang laki-laki berusia 62 tahun dengan DM tipe 2 dan penyakit ginjal kronik yang mengonsumsi obat antidiabetik datang dengan sesak napas cepat dan lemas. Analisis gas darah menunjukkan asidosis metabolik dengan anion gap tinggi, keton negatif, dan laktat meningkat. Obat yang paling mungkin berperan adalah","a":"Metformin","w":"Metformin dapat menyebabkan asidosis laktat terutama pada gangguan fungsi ginjal. Asidosis metabolik dengan keton negatif dan laktat tinggi sesuai.","d":[["Glimepirid","Efek utama adalah hipoglikemia, bukan asidosis laktat."],["Pioglitazon","Menyebabkan retensi cairan dan edema."],["Akarbosa","Menyebabkan flatulensi dan diare."],["Sitagliptin","Umumnya tidak menyebabkan asidosis laktat."]],"s":"3B","r":"Dokter umum mengenali efek serius metformin pada gangguan ginjal."},{"c":"Diabetes Melitus","q":"Seorang penyandang DM yang membutuhkan 2000 kkal per hari akan menjalani puasa Ramadan. Menurut pengaturan makan, berapa kalori yang dianjurkan saat sahur?","a":"800 kkal","w":"Kebutuhan energi saat puasa sama seperti biasa. Distribusinya adalah buka puasa 50 persen, yaitu 10 persen makanan ringan sebelum Maghrib dan 40 persen makanan utama sesudahnya, malam setelah tarawih 10 persen, dan sahur 40 persen. Jadi 40 persen dari 2000 kkal adalah 800 kkal.","d":[["400 kkal","Ini 20 persen kebutuhan, di bawah porsi sahur yang dianjurkan."],["600 kkal","Ini 30 persen kebutuhan, kurang dari porsi sahur."],["1000 kkal","Ini 50 persen kebutuhan, setara total porsi berbuka."],["1200 kkal","Ini 60 persen kebutuhan, melebihi porsi sahur."]],"s":"—","r":"Non-penyakit: edukasi puasa pada DM mencegah hipoglikemia dan hiperglikemia."},{"c":"Kegawatan DM","q":"Seorang anak laki-laki berusia 9 tahun dibawa ibunya dengan penurunan kesadaran. Akhir-akhir ini ia sering lapar dan haus serta terbangun berkali-kali pada malam hari untuk buang air kecil. Kesadaran sopor, TD 120/80 mmHg, nadi 90 x/menit, RR 22 x/menit, suhu 36,9 C. GDS 500 mg/dL, urin glukosa +3 dan keton positif. Diagnosis yang tepat adalah","a":"Ketoasidosis diabetikum","w":"Hiperglikemia berat, ketonuria, dan penurunan kesadaran pada anak dengan gejala klasik DM menunjukkan ketoasidosis diabetikum sebagai presentasi awal DM tipe 1.","d":[["Koma hiperosmolar non ketotik","HHS tidak disertai ketosis bermakna dan jarang pada anak."],["Hipoglikemia berat","GDS 500 mg/dL menyingkirkan hipoglikemia."],["Asidosis laktat","Tidak ada pencetus dan keton positif menunjukkan ketoasidosis."],["Ketosis kelaparan","Gula darah tidak setinggi itu pada ketosis kelaparan."]],"s":"3B","r":"Dokter umum mengenali KAD, memberi resusitasi awal, dan merujuk."},{"c":"Kegawatan DM","q":"Seorang laki-laki berusia 56 tahun dibawa ke IGD dengan mual muntah hebat dan sangat lemas. Ia memiliki riwayat DM dan tidak kontrol 2 bulan terakhir. GCS E2V3M5, TD 90/60 mmHg, nadi 120 x/menit, RR 40 x/menit, suhu 37,5 C, napas cepat dan dalam. GDS 500 mg/dL, urin ketonuria dan glukosuria. Diagnosis yang tepat adalah","a":"Ketoasidosis diabetikum","w":"Hiperglikemia, ketonuria, napas Kussmaul, dehidrasi, dan penurunan kesadaran pada penyandang DM yang tidak terkontrol adalah gambaran KAD.","d":[["Status hiperosmolar hiperglikemik","Pada HHS tidak ada ketosis bermakna dan glukosa biasanya lebih dari 600 mg/dL."],["Hipoglikemia berat","GDS 500 mg/dL tidak sesuai."],["Asidosis laktat","Tidak sesuai karena ketonuria dan hiperglikemia berat."],["Hiperglikemia tanpa komplikasi","Tanda dehidrasi, penurunan kesadaran, dan napas Kussmaul menunjukkan komplikasi akut."]],"s":"3B","r":"Dokter umum menstabilkan pasien KAD dan merujuk."},{"c":"Kegawatan DM","q":"Seorang laki-laki berusia 58 tahun dibawa karena tidak dapat diajak berkomunikasi sejak kemarin. TD 100/70 mmHg, nadi 78 x/menit, RR 28 x/menit dengan pernapasan Kussmaul. GDS 380 mg/dL dan ketonuria positif. Hasil analisis gas darah yang diharapkan adalah","a":"Asidosis metabolik","w":"Ketoasidosis menyebabkan akumulasi asam keton sehingga pH dan bikarbonat turun. Napas Kussmaul adalah kompensasi respiratorik.","d":[["Normal","Tidak sesuai dengan gambaran klinis."],["Alkalosis respiratorik","Hiperventilasi di sini bersifat kompensasi, bukan primer."],["Asidosis respiratorik","Tidak ada retensi CO2 karena pasien hiperventilasi."],["Alkalosis metabolik","Tidak sesuai karena terdapat asam keton berlebih."]],"s":"3B","r":"Interpretasi analisis gas darah sederhana adalah bagian dari kegawatan DM."},{"c":"Kegawatan DM","q":"Pernapasan cepat dan dalam yang khas pada ketoasidosis diabetikum disebut","a":"Pernapasan Kussmaul","w":"Pernapasan Kussmaul adalah hiperventilasi dalam dan cepat sebagai kompensasi asidosis metabolik, umum pada KAD.","d":[["Pernapasan Cheyne-Stokes","Pola siklik crescendo-decrescendo dengan apnea, pada gagal jantung atau lesi serebral."],["Pernapasan Biot","Pola tidak teratur dengan apnea, pada lesi pons atau medula."],["Pernapasan apneustik","Inspirasi panjang tertahan, akibat lesi pons."],["Ortopnea","Sesak saat berbaring, bukan pola napas."]],"s":"—","r":"Non-penyakit: tanda klinis penting pada kegawatan metabolik."},{"c":"Kegawatan DM","q":"Seorang perempuan berusia 30 tahun datang ke IGD dengan lemas, mual, muntah, dan napas cepat sejak 2 hari. Ia sedang mengalami infeksi saluran kemih dan sudah 2 hari tidak memakai obat diabetesnya. Pasien tampak dehidrasi berat, kesadaran menurun, dan napas berbau aseton dengan frekuensi 32 x/menit. Gula darah 460 mg/dL, pH 7,10, HCO3 9 mEq/L, keton urin positif. Rehidrasi awal pasien ini menggunakan","a":"NaCl 0,9 persen","w":"Resusitasi awal KAD adalah NaCl 0,9 persen, 1-1,5 liter pada jam pertama, untuk memulihkan volume intravaskular.","d":[["NaCl 0,45 persen","Dipakai setelah resusitasi awal bila natrium terkoreksi normal atau tinggi."],["Dekstrosa 10 persen","Hanya ditambahkan bila glukosa turun hingga sekitar 250 mg/dL."],["Insulin intravena bolus tanpa cairan","Insulin diberikan setelah rehidrasi awal dan kalium dipastikan adekuat."],["Natrium bikarbonat","Hanya dipertimbangkan bila pH kurang dari 6,9, sedangkan pH pasien 7,10."]],"s":"3B","r":"Rehidrasi adalah langkah awal paling penting pada KAD."},{"c":"Kegawatan DM","q":"Seorang perempuan berusia 30 tahun dengan KAD memiliki gula darah 460 mg/dL, pH 7,10, HCO3 9 mEq/L, natrium 140 mEq/L, dan kalium 3,2 mEq/L. Cairan NaCl 0,9 persen sudah mulai diberikan. Apakah langkah berikutnya sebelum insulin diberikan?","a":"Koreksi kalium","w":"Bila kalium serum kurang dari 3,3 mEq/L, insulin ditunda dan kalium diberikan lebih dulu, karena insulin menggeser kalium ke dalam sel dan dapat menyebabkan hipokalemia berat dengan aritmia. Insulin dimulai setelah kalium lebih dari 3,3 mEq/L.","d":[["Insulin intravena segera","Berbahaya karena dapat memperberat hipokalemia."],["NaCl 0,45 persen","Penggantian cairan dilanjutkan, tetapi kalium yang rendah harus dikoreksi dahulu."],["Dekstrosa 10 persen","Belum ada indikasi karena glukosa masih 460 mg/dL."],["Natrium bikarbonat","Tidak diindikasikan pada pH 7,10."]],"s":"3B","r":"Kalium harus dipantau selama terapi KAD karena aritmia adalah penyebab kematian yang dapat dicegah."},{"c":"Kegawatan DM","q":"Seorang pasien KAD sudah mendapat NaCl 0,9 persen 1 liter. Natrium terkoreksi 146 mEq/L dan kalium 4,6 mEq/L. Cairan lanjutan yang sesuai adalah","a":"NaCl 0,45 persen 4-14 mL per kgBB per jam","w":"Setelah resusitasi awal, bila natrium terkoreksi normal atau tinggi, lanjutkan NaCl 0,45 persen 4-14 mL/kgBB/jam sesuai status hidrasi. Bila rendah, tetap NaCl 0,9 persen.","d":[["NaCl 0,9 persen 4-14 mL per kgBB per jam","Dipakai bila natrium terkoreksi rendah."],["Dekstrosa 5 persen dalam air","Menurunkan osmolaritas terlalu cepat dan tanpa elektrolit."],["Ringer laktat dosis tinggi saja","Tidak sesuai algoritma standar."],["Dekstrosa 10 persen","Dipakai bila glukosa mencapai sekitar 250 mg/dL."]],"s":"3B","r":"Tatalaksana KAD berjenjang mengikuti algoritma standar."},{"c":"DM & Kehamilan","q":"Seorang ibu hamil memeriksakan kehamilan. Pada kehamilan sebelumnya ia melahirkan bayi makrosomia. Bagaimana penapisan diabetes melitus gestasional yang tepat?","a":"TTGO 75 gram pada kunjungan antenatal pertama","w":"Ibu hamil dengan faktor risiko tinggi seperti riwayat makrosomia, obesitas, riwayat DM keluarga, atau riwayat DMG diskrining pada kunjungan pertama dengan TTGO 75 gram. Bila normal, ulangi pada usia kehamilan 24-28 minggu.","d":[["TTGO 75 gram hanya pada akhir trimester kedua","Menunda skrining pada ibu berisiko tinggi, padahal DM pra-gestasional bisa terlewat."],["Pemeriksaan HbA1c satu kali pada trimester ketiga","Bukan strategi skrining yang direkomendasikan, dan terlalu terlambat."],["Pemantauan berat badan tanpa pemeriksaan glukosa","Tidak memeriksa hiperglikemia sama sekali."],["Gula darah sewaktu satu kali tanpa lanjutan","Kurang sensitif untuk menegakkan DMG."]],"s":"3B","r":"Dokter umum melakukan penapisan DMG dan merujuk bila terdiagnosis."},{"c":"DM & Kehamilan","q":"Pada kehamilan, diabetes melitus gestasional umumnya mulai terjadi pada usia kehamilan berapa?","a":"24-28 minggu","w":"Resistensi insulin fisiologis meningkat seiring kenaikan hormon plasenta pada trimester kedua. Hiperglikemia pada DMG biasanya mulai timbul pada usia kehamilan 24-28 minggu, sehingga skrining rutin dilakukan pada rentang ini.","d":[["Kurang dari 16 minggu","Pada periode ini hiperglikemia lebih mungkin DM pra-gestasional."],["16-20 minggu","Resistensi insulin belum cukup tinggi."],["20-24 minggu","Belum mencapai puncak hormon diabetogenik."],["28-32 minggu","Bisa terjadi tetapi bukan awal onset yang khas."]],"s":"3B","r":"Waktu skrining tepat adalah kunci deteksi dini."},{"c":"DM & Kehamilan","q":"Apakah penyebab utama terjadinya diabetes melitus gestasional?","a":"Resistensi insulin fisiologis","w":"Hormon plasenta seperti hPL, estrogen, progesteron, kortisol, dan hormon pertumbuhan menyebabkan resistensi insulin fisiologis. Bila sel beta tidak dapat mengompensasi, timbul DMG.","d":[["Defisiensi insulin absolut","Terjadi pada DM tipe 1."],["Destruksi autoimun sel beta pankreas","Mekanisme DM tipe 1."],["Hiperfungsi sel alfa pankreas","Bukan penyebab utama DMG."],["Mutasi gen glukokinase","Penyebab MODY, bukan DMG yang umum."]],"s":"3B","r":"Pemahaman patogenesis menentukan edukasi dan terapi."},{"c":"Gizi & Gizi Buruk","q":"Seorang ibu hamil trimester ketiga memiliki LILA 22 cm. Bagaimana interpretasinya?","a":"Risiko kekurangan energi kronik","w":"Batas normal LILA ibu hamil adalah minimal 23,5 cm. Bila kurang dari angka itu, ibu berisiko mengalami kekurangan energi kronik atau KEK.","d":[["Gizi normal","LILA normal adalah 23,5 cm atau lebih."],["Gizi lebih","Tidak sesuai, karena LILA di bawah normal."],["Obesitas","Tidak sesuai, karena LILA di bawah normal."],["Anemia defisiensi besi","Anemia dinilai dari kadar hemoglobin, bukan LILA."]],"s":"4A","r":"Penapisan KEK pada ANC adalah tugas dokter dan bidan di layanan primer."},{"c":"Tiroid","q":"Seorang perempuan petani tinggal di daerah pegunungan dan sehari-hari mengonsumsi sayuran hasil kebunnya seperti kol dan sawi. Ia mengeluh pembesaran leher dan mudah lelah. Diagnosis yang paling mungkin adalah","a":"Goiter endemik","w":"Defisiensi iodium di daerah pegunungan, ditambah konsumsi sayur goitrogenik seperti kol dan sawi, menyebabkan goiter endemik.","d":[["Tiroiditis Hashimoto","Penyebabnya autoimun, bukan lingkungan."],["Struma adenomatosa","Berupa nodul, tanpa kaitan khas dengan lingkungan."],["Tiroiditis subakut","Disertai nyeri dan didahului infeksi virus."],["Penyakit Graves","Hipertiroid autoimun dengan gejala hipermetabolik."]],"s":"4A","r":"Goiter endemik adalah masalah kesehatan masyarakat yang harus dikenali dokter umum."},{"c":"Tiroid","q":"Seorang perempuan dengan goiter endemik datang dengan kadar T3 dan T4 menurun. Terapi yang tepat adalah","a":"Levotiroksin","w":"Bila terjadi hipotiroidisme, terapi penggantian hormon dengan levotiroksin diberikan, bersama perbaikan asupan iodium.","d":[["Propiltiourasil","Antitiroid dipakai untuk hipertiroid."],["Metimazol","Antitiroid dipakai untuk hipertiroid."],["Larutan Lugol","Iodium berlebih tidak menggantikan hormon tiroid."],["Iodium radioaktif","Dipakai pada hipertiroid dan kanker tiroid."]],"s":"3A","r":"Dokter umum memulai terapi hipotiroid sesuai pedoman."},{"c":"Tiroid","q":"Seorang laki-laki berusia 36 tahun datang dengan penurunan berat badan drastis, jantung berdebar-debar, dan tidak tahan panas. Terapi yang sesuai adalah","a":"Propiltiourasil","w":"Gejala hipermetabolik menunjukkan hipertiroid. Antitiroid seperti propiltiourasil atau metimazol menghambat sintesis hormon tiroid. Metimazol umumnya dipilih lebih dulu, sedangkan PTU untuk trimester pertama dan krisis tiroid.","d":[["Dapagliflozin","Antidiabetik penghambat SGLT-2."],["Statin","Obat dislipidemia."],["Metformin","Antidiabetik biguanid."],["Glimepirid","Sulfonilurea untuk DM tipe 2."]],"s":"3A","r":"Dokter umum memulai antitiroid dan merujuk bila perlu."},{"c":"Tiroid","q":"Seorang perempuan mengeluh sering buang air kecil, sulit tidur, dan berat badan terus menurun. Pemeriksaan fungsi tiroid manakah yang dilakukan pertama kali?","a":"TSH","w":"TSH adalah tes penapis paling sensitif untuk disfungsi tiroid. Pada hipertiroid primer, TSH tertekan.","d":[["FT4","Dilakukan setelah TSH abnormal."],["TRH","Tidak dipakai sebagai pemeriksaan rutin."],["T4 total","Dipengaruhi protein pengikat."],["Antibodi TPO","Dipakai untuk mencari penyebab autoimun, bukan tes pertama."]],"s":"3A","r":"Pemeriksaan penapis yang tepat menghemat biaya dan waktu."},{"c":"Tiroid","q":"Seorang pasien memiliki kadar TSH tinggi, sedangkan T3 dan T4 rendah. Apa diagnosisnya?","a":"Hipotiroid primer","w":"Hormon tiroid rendah dengan TSH tinggi menunjukkan kelenjar tiroid yang gagal, sehingga hipofisis meningkatkan TSH. Ini hipotiroid primer.","d":[["Hipotiroid sekunder","TSH rendah atau normal rendah karena kegagalan hipofisis."],["Hipertiroid primer","TSH tertekan dan T4 tinggi."],["Hipertiroid sekunder","TSH tinggi bersama T4 tinggi, kasus langka."],["Eutiroid","Semua nilai normal."]],"s":"3A","r":"Interpretasi tes fungsi tiroid dasar."},{"c":"Tiroid","q":"Seorang pasien hipotiroid yang telah mengonsumsi levotiroksin beberapa bulan tetap memiliki TSH tinggi. Dokter merencanakan penyesuaian dosis. Pilihan yang tepat adalah","a":"Menaikkan dosis levotiroksin setelah memastikan kepatuhan dan cara minum obat","w":"TSH yang tetap tinggi menunjukkan terapi belum adekuat, jadi dosis dinaikkan setelah menyingkirkan penyebab absorpsi buruk atau ketidakpatuhan.","d":[["Menghentikan levotiroksin","Akan memperparah hipotiroidisme."],["Mengganti dengan liotironin","Bukan terapi lini pertama karena waktu paruhnya pendek."],["Menurunkan dosis levotiroksin","Menurunkan dosis akan menaikkan TSH."],["Menambahkan antitiroid","Tidak ada indikasi karena pasien hipotiroid."]],"s":"3A","r":"Dokter umum menyesuaikan dosis levotiroksin berdasarkan TSH."},{"c":"Tiroid","q":"Seorang pasien hipotiroid mulai diberikan levotiroksin. Kapankah waktu minum yang tepat?","a":"Pagi hari saat perut kosong sebelum makan","w":"Levotiroksin paling baik diserap saat perut kosong, sehingga diminum 30-60 menit sebelum sarapan dan dipisahkan dari kalsium dan zat besi.","d":[["Bersamaan dengan suplemen zat besi","Zat besi mengikat levotiroksin dan menurunkan absorpsi."],["Segera sesudah makan siang","Makanan menghambat absorpsi."],["Bersama susu","Kalsium dalam susu menurunkan absorpsi."],["Bebas kapan saja tanpa memperhatikan makan","Waktu minum memengaruhi absorpsi."]],"s":"—","r":"Non-penyakit: edukasi penggunaan obat."},{"c":"Tiroid","q":"Seorang dokter mengulas efek samping antitiroid kepada pasien Graves. Efek samping yang relatif sering dan ditakuti adalah","a":"Agranulositosis","w":"Agranulositosis adalah efek samping serius antitiroid yang jarang tetapi paling ditakuti, sehingga pasien dianjurkan segera datang bila demam dan nyeri tenggorok.","d":[["Hipotiroidisme","Bisa terjadi pada dosis berlebih, tetapi reversibel dan tidak seberbahaya agranulositosis."],["Hiperglikemia","Bukan efek khas antitiroid."],["Osteoporosis","Lebih terkait dengan hipertiroid yang tidak terkontrol."],["Eksoftalmus","Merupakan manifestasi Graves, bukan efek samping obat."]],"s":"3A","r":"Dokter umum mengedukasi pasien tentang gejala bahaya antitiroid."},{"c":"Tiroid","q":"Bagaimanakah mekanisme kerja metimazol pada hipertiroidisme?","a":"Menghambat enzim tiroid peroksidase sehingga sintesis hormon tiroid menurun","w":"Metimazol dan PTU menghambat tiroid peroksidase yang mengkatalisis iodinasi tirosin dan coupling. PTU juga menghambat konversi perifer T4 menjadi T3.","d":[["Meningkatkan ekskresi iodium melalui ginjal","Bukan mekanisme antitiroid."],["Memblok reseptor TSH di sel folikel","Bukan mekanisme metimazol."],["Merusak sel folikel melalui radiasi","Itu mekanisme iodium radioaktif."],["Menghambat pelepasan TRH di hipotalamus","Bukan mekanisme obat."]],"s":"—","r":"Non-penyakit: farmakologi antitiroid."},{"c":"Tiroid","q":"Seorang pasien Graves yang telah eutiroid setelah 6 bulan terapi antitiroid diberikan metimazol 5-10 mg per hari. Dosis tersebut termasuk","a":"Dosis pemeliharaan","w":"Metimazol dosis awal 15-30 mg per hari, lalu diturunkan ke dosis pemeliharaan 5-10 mg per hari setelah eutiroid.","d":[["Dosis awal untuk hipertiroid berat","Dosis awal jauh lebih tinggi."],["Dosis untuk krisis tiroid","Krisis tiroid memakai PTU dosis tinggi."],["Dosis ablatif","Ablasi memakai iodium radioaktif atau operasi."],["Dosis profilaksis hipertiroid pada kehamilan","Tidak ada dosis profilaksis seperti itu."]],"s":"3A","r":"Dokter umum menyesuaikan dosis antitiroid."},{"c":"Tiroid","q":"Seorang pasien Graves dengan oftalmopati aktif akan menjalani terapi iodium radioaktif dan khawatir terhadap efek sampingnya. Efek samping yang perlu diwaspadai adalah","a":"Perburukan oftalmopati Graves","w":"Terapi iodium radioaktif dapat memperburuk oftalmopati Graves, terutama pada perokok, sehingga kortikosteroid profilaksis dipertimbangkan. Efek lain adalah hipotiroid permanen.","d":[["Peningkatan bermakna risiko kanker tiroid","Bukti tidak menunjukkan peningkatan bermakna risiko kanker tiroid."],["Agranulositosis","Efek khas antitiroid, bukan iodium radioaktif."],["Gagal hati akut","Lebih terkait PTU."],["Hipertiroid permanen","Tujuannya justru mengurangi hormon, dan hasil umumnya hipotiroid."]],"s":"—","r":"Non-penyakit: farmakologi terapi hipertiroid."},{"c":"Tiroid","q":"Seorang wanita berusia 30 tahun, hamil 28 minggu, datang dengan sesak, demam, dan berkeringat. Pasien gelisah dengan nadi 140 x/menit. Kondisi hipermetabolik akibat peningkatan hormon tiroid yang berlebihan ini disebut","a":"Krisis tiroid","w":"Hipertiroid dengan demam, takikardia berat, agitasi, dan dekompensasi sistemik adalah krisis tiroid, kegawatan yang dapat dicetuskan infeksi atau kehamilan.","d":[["Tiroiditis","Peradangan tiroid, tidak selalu hipermetabolik berat."],["Atrial fibrilasi","Aritmia yang bisa menjadi komplikasi, bukan kondisi dasarnya."],["Hipertiroid tanpa komplikasi","Tidak ada demam dan takikardia berat serta agitasi."],["Hipotiroid","Berlawanan dengan gambaran klinis."]],"s":"3B","r":"Dokter umum mengenali krisis tiroid dan merujuk segera."},{"c":"Tiroid","q":"Seorang perempuan hamil datang untuk ANC. Dokter menemukan janin kecil dan meminta pemeriksaan TSH serta FT4. Bagaimana perubahan fisiologis TSH pada kehamilan?","a":"Menurun pada trimester pertama","w":"HCG pada trimester pertama menstimulasi reseptor TSH dan menekan TSH, sehingga rentang rujukan TSH pada trimester pertama lebih rendah, yaitu 0,1-2,5 mIU/L.","d":[["Meningkat pada trimester pertama","Berlawanan dengan efek hCG."],["Tidak berubah selama kehamilan","Terdapat perubahan fisiologis."],["Meningkat tajam pada trimester kedua","Rentang trimester kedua 0,2-3,0 mIU/L."],["Menghilang pada trimester ketiga","TSH tidak menghilang."]],"s":"—","r":"Non-penyakit: fisiologi kehamilan. Penting untuk menghindari salah diagnosis hipertiroid."},{"c":"Tiroid","q":"Seorang perempuan berusia 40 tahun datang dengan benjolan di leher sejak 2 minggu yang sangat nyeri. Tangan gemetar dan berat badan turun tanpa diet. Sebelumnya ia batuk pilek. Pada leher didapatkan benjolan difus yang ikut bergerak saat menelan dan nyeri tekan. Diagnosis yang paling sesuai adalah","a":"Tiroiditis de Quervain","w":"Nyeri leher setelah infeksi saluran napas atas virus, benjolan difus nyeri tekan, dan tirotoksikosis sementara menunjukkan tiroiditis subakut granulomatosa atau de Quervain.","d":[["Struma difus toksik","Graves tidak nyeri dan tidak didahului infeksi."],["Tiroiditis akut","Disebabkan bakteri, dengan demam tinggi dan abses."],["Tiroiditis Hashimoto","Tidak nyeri dan biasanya hipotiroid."],["Karsinoma tiroid","Benjolan keras, tidak nyeri, tanpa gejala tirotoksikosis akut."]],"s":"3A","r":"Dokter umum mengenali tiroiditis subakut dan memberi terapi simptomatik."},{"c":"Tiroid","q":"Perhatikan preparat histologi tiroid berikut yang menunjukkan sel datia berinti banyak dan infiltrat radang kronik di sekitar folikel yang rusak. Apakah diagnosisnya?","img":"i6","a":"Tiroiditis granulomatosa subakut","w":"Folikel rusak dengan sel datia berinti banyak yang mengelilingi koloid dan infiltrat inflamasi adalah ciri tiroiditis granulomatosa subakut atau de Quervain.","d":[["Tiroiditis Hashimoto","Infiltrat limfoplasmasitik dengan pusat germinal dan sel Hurthle, tanpa granuloma."],["Tiroiditis limfositik subakut tanpa nyeri","Infiltrat limfositik tanpa sel datia."],["Adenoma tiroid","Berupa lesi berkapsul dengan folikel seragam."],["Karsinoma papiler tiroid","Inti ground glass dan nuclear groove."]],"s":"—","r":"Non-penyakit: patologi anatomi tiroid."},{"c":"Tiroid","q":"Perhatikan preparat histologi tiroid berikut dengan infiltrat limfosit yang menginvasi parenkim dan folikel yang melebar tanpa sel datia. Pasien tidak mengeluh nyeri leher. Apakah diagnosisnya?","img":"i16","a":"Tiroiditis limfositik subakut tanpa nyeri","w":"Infiltrasi limfositik fokal pada tiroid tanpa granuloma, klinis tanpa nyeri, menunjukkan tiroiditis limfositik subakut atau painless.","d":[["Tiroiditis Hashimoto","Infiltrat difus dengan folikel limfoid dan sel Hurthle, biasanya hipotiroid."],["Adenoma tiroid","Berupa nodul berkapsul tanpa infiltrat."],["Karsinoma papiler tiroid","Inti khas dengan nuclear groove."],["Tiroiditis granulomatosa subakut","Ada sel datia dan nyeri."]],"s":"—","r":"Non-penyakit: patologi anatomi tiroid."},{"c":"Tiroid","q":"Seorang laki-laki berusia 30 tahun mengeluh benjolan di leher bagian tengah yang ikut bergerak ke atas saat ia menjulurkan lidah. Diagnosis yang paling mungkin adalah","a":"Kista duktus tiroglosus","w":"Sisa duktus tiroglosus menyebabkan massa garis tengah leher yang bergerak naik saat protrusi lidah dan saat menelan.","d":[["Kista tiroid","Bergerak saat menelan, tetapi tidak saat menjulurkan lidah."],["Hipertiroid","Ini kondisi fungsional, bukan massa khas."],["Limfadenitis servikal","Tidak bergerak dengan lidah."],["Kista brankial","Terletak lateral pada leher."]],"s":"3A","r":"Dokter umum mengenali massa leher khas dan merujuk untuk bedah."},{"c":"Tiroid","q":"Seorang pasien menjalani pengangkatan kedua lobus tiroid, dengan masing-masing lobus disisakan sekitar 2 gram jaringan. Tindakan ini disebut","a":"Tiroidektomi subtotal","w":"Tiroidektomi subtotal adalah dua lobektomi subtotal ditambah istmektomi, dengan sisa jaringan sekitar 2-4 gram per sisi.","d":[["Tiroidektomi total","Mengangkat seluruh jaringan tiroid."],["Tiroidektomi hampir total","Menyisakan jaringan kurang dari 1 gram, yaitu prosedur Dunhill."],["Lobektomi total","Mengangkat satu lobus saja."],["Istmolobektomi","Mengangkat satu lobus bersama istmus."]],"s":"—","r":"Non-penyakit: prosedur bedah tiroid."},{"c":"Tiroid","q":"Seorang perempuan memiliki benjolan di leher kanan dan menginginkan pengangkatan satu lobus saja karena alasan kosmetik. Tindakan yang sesuai adalah","a":"Istmolobektomi","w":"Operasi tiroid dasar adalah lobektomi total ditambah istmektomi, yang disebut istmolobektomi, untuk nodul unilateral.","d":[["Lobektomi total","Mengangkat satu lobus tanpa istmus. Dalam praktik standar ditambah istmektomi."],["Tiroidektomi hampir total","Mengangkat hampir seluruh kelenjar, lebih luas dari yang diinginkan."],["Tiroidektomi total","Mengangkat seluruh kelenjar."],["Tiroidektomi subtotal","Mengangkat kedua lobus sebagian."]],"s":"—","r":"Non-penyakit: prosedur bedah tiroid."},{"c":"Tiroid","q":"Seorang pasien dengan nodul tiroid menjalani operasi, dan setelah operasi ia mengalami suara serak. Penyebabnya adalah cedera pada","a":"Nervus laringeus rekuren","w":"Nervus laringeus rekuren mempersarafi otot intrinsik laring. Cedera menyebabkan paresis pita suara dan suara serak.","d":[["Nervus asesorius","Mempersarafi otot sternokleidomastoideus dan trapezius."],["Trakea","Cedera trakea menyebabkan gangguan napas, bukan paresis pita suara."],["Intubasi endotrakeal","Dapat menyebabkan suara serak ringan, tetapi bukan penyebab khas bedah tiroid."],["Nervus vagus","Cedera tinggi jarang pada tiroidektomi."]],"s":"—","r":"Non-penyakit: anatomi bedah tiroid."},{"c":"Tiroid","q":"Seorang pasien mengalami kejang beberapa jam setelah tiroidektomi total. Penyebabnya adalah","a":"Hipokalsemia","w":"Cedera atau pengangkatan paratiroid saat tiroidektomi menyebabkan hipoparatiroidisme dan hipokalsemia sehingga timbul tetani atau kejang.","d":[["Hipotiroid","Menyebabkan kelelahan dan bradikardia, bukan kejang akut."],["Hipertiroid","Tidak menyebabkan kejang pascaoperasi."],["Hiperkalemia","Tidak berkaitan dengan tiroidektomi."],["Lesi nervus vagus","Menyebabkan gangguan suara atau aritmia."]],"s":"3B","r":"Dokter umum mengenali komplikasi bedah tiroid dan memberi kalsium."},{"c":"Adrenal & Hipofisis","q":"Seorang perempuan berusia 45 tahun datang dengan mudah lelah dan luka di punggung kaki yang tidak kunjung sembuh. TD 150/80 mmHg, nadi 96 x/menit, RR 20 x/menit, afebris. Tampak moon face, akne pustular, dan buffalo hump. Diagnosis yang paling mungkin adalah","a":"Sindrom Cushing","w":"Moon face, buffalo hump, hipertensi, akne, dan penyembuhan luka yang buruk adalah gambaran hiperkortisolisme, yaitu sindrom Cushing.","d":[["Penyakit Addison","Insufisiensi adrenal dengan hipotensi dan hiperpigmentasi."],["Penyakit Graves","Hipertiroid autoimun."],["Penyakit Paget","Kelainan remodeling tulang."],["Sindrom Conn","Hiperaldosteronisme dengan hipertensi dan hipokalemia tanpa fenotipe Cushingoid."]],"s":"2","r":"Dokter umum mengenali gejala dan merujuk ke spesialis."},{"c":"Adrenal & Hipofisis","q":"Seorang perempuan berusia 40 tahun memiliki striae ungu dan moon face yang mengarah ke sindrom Cushing. Tes penapis awal yang tepat adalah","a":"Tes supresi deksametason dosis rendah","w":"Penapisan hiperkortisolisme memakai salah satu dari tes supresi deksametason 1 mg semalam, kortisol bebas urin 24 jam, atau kortisol saliva tengah malam. ACTH serum diperiksa sesudah hiperkortisolisme terbukti, untuk membedakan sumber ACTH-dependent dan independent.","d":[["Kadar ACTH serum","Dipakai setelah konfirmasi biokimia untuk mencari penyebab."],["MRI hipofisis","Dilakukan setelah biokimia menunjukkan ACTH-dependent."],["Kadar aldosteron plasma","Untuk hiperaldosteronisme primer."],["CT scan abdomen","Dilakukan bila ACTH-independent."]],"s":"2","r":"Dokter umum memahami alur diagnostik dan merujuk."},{"c":"Adrenal & Hipofisis","q":"Pada sindrom Cushing endogen, lesi tumor yang paling sering menjadi penyebab terletak pada","a":"Hipofisis","w":"Adenoma hipofisis penghasil ACTH atau penyakit Cushing adalah penyebab endogen tersering sekitar 70 persen kasus.","d":[["Adrenal","Adenoma atau karsinoma adrenal lebih jarang."],["Hipotalamus","Lesi hipotalamus sangat jarang menyebabkan Cushing."],["Paru","Tumor paru ektopik penghasil ACTH lebih jarang."],["Pankreas","Tumor pankreas ektopik sangat jarang."]],"s":"2","r":"Konsep penyebab membantu menjelaskan rujukan kepada pasien."},{"c":"Adrenal & Hipofisis","q":"Seorang laki-laki berusia 50 tahun mengeluhkan sakit kepala dan kelelahan terus-menerus disertai kram otot, terutama pada betis. Ia memiliki riwayat hipertensi 10 tahun dan minum antihipertensi oral. TD 170/110 mmHg, neurologis normal. USG abdomen menunjukkan pembesaran kelenjar adrenal yang dicurigai adenoma. Terapi yang tepat adalah","a":"Bedah adenoma","w":"Hipertensi resisten dengan kram otot menunjukkan kemungkinan hiperaldosteronisme primer. Adenoma adrenal penghasil aldosteron atau sindrom Conn diterapi dengan adrenalektomi.","d":[["Kombinasi antihipertensi oral","Kontrol sementara tetapi tidak menyembuhkan sebab."],["Antihipertensi intravena","Tidak ada tanda krisis hipertensi dengan kerusakan organ."],["Hemodialisis","Tidak ada gagal ginjal."],["Pemantauan elektrolit saja","Tidak menyelesaikan penyebab."]],"s":"2","r":"Dokter umum mengenali hipertensi sekunder dan merujuk."},{"c":"Adrenal & Hipofisis","q":"Pada pasien hipertensi dengan adenoma adrenal penghasil aldosteron, kelainan elektrolit yang paling mungkin ditemukan adalah","a":"Hipokalemia","w":"Aldosteron berlebih meningkatkan retensi natrium dan ekskresi kalium, sehingga timbul hipokalemia yang menyebabkan kram dan kelemahan otot.","d":[["Hiperkalemia","Terjadi pada defisiensi aldosteron."],["Hipokalsemia","Tidak berkaitan dengan aldosteron."],["Hiponatremia","Natrium biasanya normal atau sedikit tinggi."],["Hipomagnesemia","Bukan temuan khas."]],"s":"2","r":"Pemeriksaan elektrolit sederhana membantu menemukan penyebab hipertensi sekunder."},{"c":"Adrenal & Hipofisis","q":"Seorang perempuan berusia 40 tahun datang dengan lemah, anoreksia, penurunan berat badan, dan hiperpigmentasi pada telapak tangan serta mukosa mulut. TD 85/55 mmHg. Diagnosis yang paling mungkin adalah","a":"Insufisiensi adrenal primer","w":"Gejala lemah, anoreksia, hiperpigmentasi, dan hipotensi adalah gambaran khas penyakit Addison.","d":[["Sindrom Cushing","Hiperkortisol dengan hipertensi."],["Hipertiroid","Tidak memberi hiperpigmentasi dan hipotensi."],["Feokromositoma","Hipertensi paroksismal."],["Sindrom Conn","Hipertensi dengan hipokalemia."]],"s":"2","r":"Dokter umum mengenali krisis adrenal dan memberi kortikosteroid darurat sebelum merujuk."},{"c":"Adrenal & Hipofisis","q":"Perhatikan preparat histologi berikut yang menunjukkan sel-sel besar bersitoplasma jernih tersusun dalam sarang pada lesi massa adrenal. Apakah diagnosisnya menurut materi kuliah?","img":"i13","a":"Adenoma korteks adrenal","w":"Sel kortikal bersitoplasma jernih kaya lipid yang tersusun dalam sarang dan jaringan sinusoid mendukung adenoma korteks adrenal.","d":[["Feokromositoma","Sel dengan sitoplasma granuler dan sarang zellballen."],["Karsinoma sel ginjal tipe sel jernih","Ini mirip dan perlu dibedakan, tetapi lokasinya ginjal."],["Adenoma paratiroid","Sel utama dan oksifil dengan pola solid."],["Karsinoma folikular tiroid","Folikel dengan invasi kapsul atau vaskular."]],"s":"—","r":"Non-penyakit: patologi anatomi adrenal."},{"c":"Adrenal & Hipofisis","q":"Seorang perempuan berusia 28 tahun datang dengan amenore dan keluar cairan putih dari kedua payudara tanpa menyusui. Hormon manakah yang paling mungkin meningkat?","a":"Prolaktin","w":"Galaktorea dan amenore menunjukkan hiperprolaktinemia, misalnya akibat prolaktinoma.","d":[["Hormon pertumbuhan","Menyebabkan akromegali."],["ACTH","Menyebabkan Cushing."],["TSH","Menyebabkan hipertiroid sekunder."],["FSH","Tidak menyebabkan galaktorea."]],"s":"3A","r":"Dokter umum mencari penyebab amenore dan galaktorea serta merujuk."},{"c":"Adrenal & Hipofisis","q":"Tumor yang berasal dari sisa kantong Rathke atau kantong vestigial adalah","a":"Kraniofaringioma","w":"Kraniofaringioma berasal dari sisa epitel kantong Rathke atau duktus kraniofaringeal pada daerah sellar dan suprasellar.","d":[["Adenoma hipofisis","Berasal dari sel adenohipofisis."],["Schwannoma","Tumor sel Schwann saraf kranial."],["Meningioma","Tumor sel arachnoid."],["Glioma","Tumor sel glia."]],"s":"—","r":"Non-penyakit: patologi tumor sellar."},{"c":"Adrenal & Hipofisis","q":"Manakah gambaran histopatologi yang khas pada kraniofaringioma adamantinomatosa?","a":"Wet keratin","w":"Tipe adamantinomatosa memiliki epitel palisade, stellate reticulum, wet keratin, kalsifikasi, dan kista berisi cairan seperti minyak mesin.","d":[["Ground glass appearance","Ciri karsinoma papiler tiroid."],["Nuclear groove","Ciri karsinoma papiler tiroid."],["Inklusi intranuklear","Ciri karsinoma papiler tiroid."],["Badan psammoma","Ciri tumor seperti meningioma dan karsinoma papiler tiroid."]],"s":"—","r":"Non-penyakit: patologi tumor sellar."},{"c":"Adrenal & Hipofisis","q":"Seorang ahli patologi menjumpai tumor padat berkapsul yang dilapisi epitel skuamosa kompleks berdiferensiasi baik. Jarang terdapat kalsifikasi, keratin, atau kista. Gambaran ini khas untuk","a":"Kraniofaringioma papiler","w":"Tipe papiler bersifat solid, berkapsul, dengan epitel skuamosa berdiferensiasi baik, serta jarang berkalsifikasi, berkeratin, atau kistik.","d":[["Kraniofaringioma adamantinomatosa","Memiliki wet keratin, kalsifikasi, dan kista."],["Meningioma","Sel meningotelial dengan whorls dan psammoma."],["Adenoma hipofisis","Sel monomorfik dengan pola difus."],["Kista Rathke","Kista berlapis epitel kuboid atau silindris."]],"s":"—","r":"Non-penyakit: patologi tumor sellar."},{"c":"Obesitas & Sindrom Metabolik","q":"Seorang wanita berusia 32 tahun datang untuk pemeriksaan rutin. Tinggi badan 158 cm, berat badan 78 kg, lingkar pinggang 82 cm. Berdasarkan kriteria WHO untuk populasi Asia Pasifik, pasien ini termasuk kategori","a":"Obesitas derajat II dengan obesitas sentral","w":"IMT 78 dibagi 1,58 kuadrat adalah 31,2 kg/m2. Kriteria Asia Pasifik: berat badan lebih 23-24,9, obesitas I 25-29,9, dan obesitas II 30 atau lebih. Lingkar pinggang 80 cm atau lebih pada perempuan menunjukkan obesitas sentral.","d":[["Berat badan normal","IMT 31,2 jauh di atas batas normal."],["Berat badan lebih tanpa obesitas sentral","IMT dan lingkar pinggang melebihi ambang."],["Obesitas derajat I dengan obesitas sentral","IMT 25-29,9, sedangkan pasien 31,2."],["Obesitas derajat II tanpa obesitas sentral","Lingkar pinggang 82 cm melebihi 80 cm pada perempuan."]],"s":"4A","r":"Klasifikasi obesitas menentukan intervensi dan risiko komorbid."},{"c":"Obesitas & Sindrom Metabolik","q":"Seorang wanita berusia 29 tahun dengan IMT 28 kg/m2 mengeluh menstruasi tidak teratur sejak 6 bulan, jerawat memburuk, dan kesulitan hamil. Pemeriksaan fisik menunjukkan hirsutisme ringan dan akantosis nigrikans. Komplikasi obesitas pada sistem reproduksi yang paling mungkin adalah","a":"Sindrom ovarium polikistik","w":"Oligomenore, hiperandrogenisme seperti jerawat dan hirsutisme, infertilitas, serta akantosis nigrikans sebagai tanda resistensi insulin adalah gambaran PCOS.","d":[["Endometriosis","Nyeri panggul siklik, bukan hiperandrogenisme."],["Hiperprolaktinemia","Galaktorea dan amenore."],["Insufisiensi ovarium primer","Gejala menopause dini dengan FSH tinggi."],["Mioma uteri","Perdarahan dan nyeri, bukan hirsutisme."]],"s":"3A","r":"Dokter umum mengenali PCOS dan edukasi penurunan berat badan."},{"c":"Obesitas & Sindrom Metabolik","q":"Seorang laki-laki berusia 45 tahun mengeluh mengantuk saat bekerja. Istrinya melaporkan mendengkur keras disertai henti napas sesaat. IMT 34 kg/m2, lingkar pinggang 98 cm, TD 145/90 mmHg. Komplikasi obesitas yang paling mungkin adalah","a":"Sleep apnea obstruktif","w":"Mendengkur keras, henti napas saat tidur, dan kantuk berlebihan pada obesitas adalah khas sleep apnea obstruktif.","d":[["Hipertensi esensial","Merupakan komorbid, tetapi tidak menjelaskan keluhan utama."],["Gagal jantung kongestif","Menyebabkan sesak, ortopnea, dan edema."],["Sindrom hipoventilasi obesitas","Memerlukan hiperkapnia siang hari."],["Penyakit paru obstruktif kronik","Berkaitan dengan merokok, tidak dengan henti napas saat tidur."]],"s":"3A","r":"Dokter umum mengenali OSA dan merujuk untuk polisomnografi."},{"c":"Obesitas & Sindrom Metabolik","q":"Seorang wanita berusia 38 tahun dengan IMT 31 kg/m2, lingkar pinggang 88 cm, TD 138/88 mmHg, trigliserida 165 mg/dL, HDL 45 mg/dL, dan glukosa puasa 108 mg/dL. Berdasarkan konsensus Asia Pasifik, berapa kriteria sindrom metabolik yang dipenuhi?","a":"5 kriteria","w":"Kriteria Asia Pasifik pada perempuan: lingkar pinggang lebih dari 80 cm, TG 150 mg/dL atau lebih, HDL kurang dari 50 mg/dL, TD sistolik 130 atau diastolik 85 mmHg atau lebih, dan glukosa puasa 100 mg/dL atau lebih. Semuanya terpenuhi.","d":[["2 kriteria","Terlalu sedikit."],["3 kriteria","Terlalu sedikit."],["4 kriteria","Terlalu sedikit."],["Tidak memenuhi kriteria sindrom metabolik","Minimal 3 kriteria terpenuhi."]],"s":"3A","r":"Identifikasi sindrom metabolik membantu mencegah DM dan penyakit kardiovaskular."},{"c":"Obesitas & Sindrom Metabolik","q":"Seorang laki-laki berusia 50 tahun dengan IMT 39 kg/m2 memiliki riwayat DM tipe 2, hipertensi, dan sleep apnea. Ia telah menjalani terapi konservatif intensif selama 18 bulan dengan hasil minimal. Berdasar
